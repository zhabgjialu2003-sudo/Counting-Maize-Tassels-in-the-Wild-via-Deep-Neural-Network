name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source without large LFS artefacts
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deterministic check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0" "flask-cors>=4.0" "psycopg[binary]>=3.2" \
            "python-dotenv>=1.0" "pillow>=10.0" "numpy>=1.24" \
            "cryptography>=42.0" "waitress>=3.0.2"

      - name: Compile Python source
        run: python -m compileall -q backend tests

      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/auth.js
          node --check frontend/js/mobile.js
          node --check frontend/js/pwa.js
          node --check frontend/sw.js

      - name: Run fast repository tests
        run: |
          python -m unittest discover -s tests -p "test_migrations.py" -v
          python -m unittest discover -s tests -p "test_security_controls.py" -v
          python -m unittest discover -s tests -p "test_image_security.py" -v
          python -m unittest discover -s tests -p "test_mobile_pwa.py" -v
          python -m unittest discover -s tests -p "test_submission_readiness.py" -v

      - name: Confirm no runtime data is tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)(uploads|backups)/|\.(dump|bak|sqlite|sqlite3|db)$'; then
            echo "Tracked runtime or secret-bearing data was found."
            exit 1
          fi
