services:
  - type: web
    name: maize-detector
    runtime: python
    repo: https://github.com/zhabgjialu2003-sudo/Counting-Maize-Tassels-in-the-Wild-via-Deep-Neural-Network
    plan: standard
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: python -m backend.scripts.render_build
    preDeployCommand: python -m backend.scripts.initialize_render
    startCommand: python backend/server.py
    healthCheckPath: /api/health
    envVars:
      - key: PGHOST
        fromDatabase:
          name: maize-detector-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: maize-detector-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: maize-detector-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: maize-detector-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: maize-detector-db
          property: password
      - key: SECRET_KEY
        generateValue: true
      - key: FILE_ENCRYPTION_KEY
        generateValue: true
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: WAITRESS_HOST
        value: 0.0.0.0
      - key: WAITRESS_THREADS
        value: "2"
      - key: PGCONNECT_TIMEOUT
        value: "10"
      - key: PGSTATEMENT_TIMEOUT_MS
        value: "120000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://zhabgjialu2003-sudo.github.io
      - key: TOKEN_MAX_AGE_SECONDS
        value: "28800"
      - key: TASSEL_MODEL_PATH
        value: models/deployment/tassel-best.pt
      - key: DISEASE_MODEL_PATH
        value: models/deployment/maize-disease.torchscript.pt
      - key: DISEASE_ALLOW_CANDIDATE
        value: "false"
      - key: MODEL_ROOTS
        value: models
      - key: DATASET_ROOTS
        value: datasets
      - key: MAX_IMAGE_BYTES
        value: "10485760"
      - key: MAX_DATASET_BYTES
        value: "52428800"
      - key: INFERENCE_CACHE_SIZE
        value: "16"
      - key: DEMO_ACCESS_ENABLED
        value: "true"
      - key: DEMO_ACCESS_ALLOW_PRIVATE_NETWORK
        value: "false"
      - key: ALLOW_QUERY_TOKEN
        value: "false"
      - key: AUTO_MIGRATE
        value: "false"
      - key: AUTO_BACKUP_ENABLED
        value: "false"
      - key: REQUIRE_MODELS_HEALTHY
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: maize-detector-db
    databaseName: maize_detector
    user: maize_detector
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
