<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f5136">
<title>Maize Field Assistant - Offline</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/mobile.css">
</head>
<body class="mobile-home">
<main class="container" style="max-width:560px;padding-top:3rem;">
  <section class="mobile-capture-card">
    <div style="font-size:3rem" aria-hidden="true">🌾</div>
    <h1 style="color:var(--mobile-green)">暂时没有网络</h1>
    <p>图片分析需要连接服务器。请保留手机中的原照片，网络恢复后重新打开应用上传。</p>
    <hr style="margin:1.2rem 0;border:0;border-top:1px solid #c8d5c3">
    <h2 style="font-size:1.3rem;color:var(--mobile-green)">You are offline</h2>
    <p>Photo analysis needs a server connection. Keep the original photo on your phone and upload it after reconnecting.</p>
    <button class="btn btn-primary btn-lg" type="button" onclick="location.reload()">重新连接 / Try again</button>
  </section>
</main>
</body>
</html>
