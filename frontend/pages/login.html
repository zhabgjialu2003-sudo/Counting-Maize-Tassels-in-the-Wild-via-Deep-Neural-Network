<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maize Detector — Login</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .login-card { max-width:420px; margin:80px auto; }
  .login-card h2 { text-align:center; color:var(--green); margin-bottom:0.5rem; }
  .login-card .sub { text-align:center; color:var(--gray-500); margin-bottom:1.5rem; font-size:0.9rem; }
  .demo-hint { background:var(--green-bg); border-radius:6px; padding:0.75rem; margin-top:1rem; font-size:0.8rem; color:var(--green); }
  .demo-hint strong { display:block; margin-bottom:0.25rem; }
</style>
</head>
<body>

<div class="login-card card">
  <h2>Maize Detector</h2>
  <p class="sub">FYP-26-S2-7 | Tassel Counting System</p>

  <div id="errorBox"></div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>
  <button class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;" onclick="handleLogin()">
    Sign In
  </button>

  <div class="demo-hint">
    <strong>Demo Accounts (Week 10 Prototype):</strong>
    john@farm.com (Farmer) &nbsp;|&nbsp; liwei@research.org (Researcher)<br>
    maria@agro.com (Agronomist) &nbsp;|&nbsp; admin@system.com (Admin)<br>
    <small>Password: any value (prototype stage — mock validation)</small>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
// Redirect if already logged in
if (isLoggedIn()) {
  redirectByRole(currentRole());
}

function redirectByRole(role) {
  var pages = ROLE_PAGES[role];
  location.href = (pages && pages[0]) ? pages[0] : 'login.html';
}

async function handleLogin() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  var errBox = document.getElementById('errorBox');

  if (!email || !password) {
    errBox.innerHTML = '<div class="alert alert-error">Please enter email and password.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  errBox.innerHTML = '';

  var result = await doLogin(email, password);

  if (result.ok) {
    redirectByRole(result.user.role);
  } else {
    btn.disabled = false;
    btn.textContent = 'Sign In';
    errBox.innerHTML = '<div class="alert alert-error">' + esc(result.error) + '</div>';
  }
}

// Enter key to submit
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
