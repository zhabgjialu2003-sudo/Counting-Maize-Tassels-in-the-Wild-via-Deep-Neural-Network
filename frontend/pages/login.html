<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,">
<title>Maize Detector - Login</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/maize-icon-192.png">
<link rel="apple-touch-icon" href="../icons/maize-icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mobile.css">
<style>
  body { min-height:100vh; background:linear-gradient(180deg,#f3faf5 0%,#eef3ee 100%); }
  .login-card { max-width:420px; margin:72px auto; }
  .login-card h2 { text-align:center; color:var(--green); margin-bottom:0.5rem; }
  .login-card .sub { text-align:center; color:var(--gray-500); margin-bottom:1.5rem; font-size:0.9rem; }
  .auth-tabs { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1rem; }
  .auth-tabs button { min-height:40px; }
  .auth-tabs button.active { background:var(--green); color:#fff; border-color:var(--green); }
  #createForm { display:none; }
  .demo-access { margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--gray-100); }
  .demo-access h3 { margin:0; color:var(--green); font-size:1rem; }
  .demo-access-note { margin:0.2rem 0 0.75rem; color:var(--gray-500); font-size:0.8rem; }
  .demo-role-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.55rem; }
  .demo-role-button { display:grid; gap:0.1rem; min-width:0; padding:0.65rem 0.7rem; text-align:left; }
  .demo-role-button strong { font-size:0.9rem; }
  .demo-role-button small { overflow:hidden; color:inherit; font-size:0.72rem; text-overflow:ellipsis; white-space:nowrap; }
  .demo-password { margin:0.75rem 0 0; padding:0.55rem 0.7rem; border-radius:7px; background:var(--green-bg); color:var(--green); font-size:0.8rem; }
  .demo-selection { min-height:1.25rem; margin:0.45rem 0 0; color:var(--green); font-size:0.78rem; font-weight:700; }
  @media (max-width:520px) {
    .login-card { margin:32px auto; }
    .demo-role-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- SHARED BOUNDARY: A.7/A.8 access, D.1 accounts, and D.5 role permissions. -->
  <div class="login-card card">
    <h2>Maize Detector</h2>
    <p class="sub">FYP-26-S2-7 | Secure role-based access</p>

    <div id="errorBox"></div>

    <div class="auth-tabs">
      <button class="btn btn-outline active" type="button" id="tabSignIn" onclick="setAuthMode('signin')">Sign In</button>
      <button class="btn btn-outline" type="button" id="tabCreate" onclick="setAuthMode('create')">Create Account</button>
    </div>

    <div id="signInForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;" onclick="handleLogin()">
        Sign In
      </button>
    </div>

    <div id="createForm">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="newName" placeholder="Your name" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="newEmail" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="newPassword" placeholder="At least 10 characters" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-lg" id="createBtn" style="width:100%;" onclick="handleCreateAccount()">
        Create Farmer Account
      </button>
    </div>

    <section class="demo-access" id="demoAccess" aria-labelledby="demoAccessTitle" hidden>
      <h3 id="demoAccessTitle">Quick Demo Access</h3>
      <p class="demo-access-note">Choose a role to fill the sign-in form. You will still control when to sign in.</p>
      <div class="demo-role-grid" id="demoRoleGrid"></div>
      <p class="demo-password">Shared demo password: <code id="demoPassword"></code></p>
      <p class="demo-selection" id="demoSelection" role="status" aria-live="polite"></p>
    </section>

  </div>
</div>

<script src="../js/api.js?v=20260610-2"></script>
<script src="../js/auth.js?v=20260610-2"></script>
<script src="../js/mobile.js"></script>
<script src="../js/pwa.js"></script>
<script>
const loginParams = new URLSearchParams(location.search);
if (loginParams.get('password_changed') === '1') {
  document.getElementById('errorBox').innerHTML =
    '<div class="alert alert-success">Password changed. Sign in with your new password.</div>';
}

if (isLoggedIn()) {
  location.href = defaultPageForRole(currentRole());
}

function setAuthMode(mode) {
  var isCreate = mode === 'create';
  document.getElementById('signInForm').style.display = isCreate ? 'none' : 'block';
  document.getElementById('createForm').style.display = isCreate ? 'block' : 'none';
  document.getElementById('tabSignIn').classList.toggle('active', !isCreate);
  document.getElementById('tabCreate').classList.toggle('active', isCreate);
  document.getElementById('errorBox').innerHTML = '';
}

function fillDemoAccount(account, password) {
  setAuthMode('signin');
  document.getElementById('email').value = account.email;
  document.getElementById('password').value = password;
  document.getElementById('demoSelection').textContent = account.role + ' account is ready. Select Sign In to continue.';
  document.getElementById('loginBtn').focus();
}

async function loadDemoAccess() {
  var result = await apiGet('/api/demo-access');
  if (!result.ok || !result.data.enabled || !Array.isArray(result.data.accounts)) return;
  var password = String(result.data.shared_password || '');
  if (!password) return;

  var grid = document.getElementById('demoRoleGrid');
  result.data.accounts.forEach(function(account) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn btn-outline demo-role-button';
    var role = document.createElement('strong');
    role.textContent = account.role;
    var email = document.createElement('small');
    email.textContent = account.email;
    button.append(role, email);
    button.addEventListener('click', function() { fillDemoAccount(account, password); });
    grid.appendChild(button);
  });
  document.getElementById('demoPassword').textContent = password;
  document.getElementById('demoAccess').hidden = false;
}

// SHARED CONTROL CALL: POST /api/auth/login, then route by server role.
async function handleLogin() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  var errBox = document.getElementById('errorBox');

  if (!email || !password) {
    errBox.innerHTML = '<div class="alert alert-error">Please enter email and password.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  errBox.innerHTML = '';

  var result = await doLogin(email, password);

  if (result.ok) {
    location.href = defaultPageForRole(result.user.role);
  } else {
    btn.disabled = false;
    btn.textContent = 'Sign In';
    errBox.innerHTML = '<div class="alert alert-error">' + esc(result.error) + '</div>';
  }
}

// USER STORY D.1 / A.8: create a Farmer account through /api/auth/register.
async function handleCreateAccount() {
  var name = document.getElementById('newName').value.trim();
  var email = document.getElementById('newEmail').value.trim();
  var password = document.getElementById('newPassword').value;
  var btn = document.getElementById('createBtn');
  var errBox = document.getElementById('errorBox');

  if (!name || !email || password.length < 10) {
    errBox.innerHTML = '<div class="alert alert-error">Please enter a name, valid email, and password with at least 10 characters.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating...';
  errBox.innerHTML = '';

  var result = await createAccount(name, email, password);

  if (result.ok) {
    location.href = defaultPageForRole(result.user.role);
  } else {
    btn.disabled = false;
    btn.textContent = 'Create Farmer Account';
    errBox.innerHTML = '<div class="alert alert-error">' + esc(result.error) + '</div>';
  }
}

document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});

document.getElementById('newPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleCreateAccount();
});

loadDemoAccess();
</script>
</body>
</html>
