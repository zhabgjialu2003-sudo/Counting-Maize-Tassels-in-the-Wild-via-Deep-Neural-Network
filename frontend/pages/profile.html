<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f5136">
<title>My Account / 我的账户</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/maize-icon-192.png">
<link rel="apple-touch-icon" href="../icons/maize-icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mobile.css">
</head>
<body class="mobile-home">
<div id="networkStatus" class="network-status" role="status" hidden></div>

<header class="mobile-hero">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem">
    <div>
      <a href="mobile.html" id="backHome" style="color:#f7e5ae;font-weight:750;text-decoration:none">‹ 返回首页</a>
      <h1 id="pageTitle">我的账户</h1>
      <p id="pageIntro">查看资料，安全地修改登录信息。</p>
    </div>
    <select id="languageSelect" aria-label="Language / 语言" style="min-height:44px;border-radius:12px;padding:0.45rem;background:#fff;color:#17251c;font-weight:750">
      <option value="zh-CN">中文</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>

<main class="profile-shell">
  <section class="profile-identity" aria-labelledby="profileName">
    <div class="profile-avatar" aria-hidden="true">农</div>
    <div>
      <h1 id="profileName">—</h1>
      <p id="profileRole">农民用户 · Farmer</p>
    </div>
  </section>

  <section class="profile-summary" aria-label="Account summary">
    <div class="profile-summary-row">
      <small id="emailLabel">登录邮箱</small>
      <strong id="profileEmail">—</strong>
    </div>
    <div class="profile-summary-row">
      <small id="languageLabel">显示语言</small>
      <strong id="profileLanguage">中文</strong>
    </div>
  </section>

  <div class="profile-actions">
    <button class="btn btn-primary" type="button" id="editProfileButton">修改姓名或邮箱</button>
    <button class="btn btn-outline" type="button" id="changePasswordButton">修改密码</button>
  </div>

  <section class="profile-panel" id="profilePanel" hidden>
    <h2 id="profilePanelTitle">修改姓名或邮箱</h2>
    <form id="profileForm" novalidate>
      <div class="form-group">
        <label for="accountName" id="nameLabel">姓名</label>
        <input id="accountName" name="name" maxlength="100" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="accountEmail" id="newEmailLabel">登录邮箱</label>
        <input id="accountEmail" name="email" type="email" maxlength="150" inputmode="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="profileCurrentPassword" id="profilePasswordLabel">当前密码</label>
        <input id="profileCurrentPassword" name="current_password" type="password" maxlength="128" autocomplete="current-password" required>
        <div class="profile-help" id="profilePasswordHelp">用于确认是你本人操作，我们不会保存明文密码。</div>
      </div>
      <div id="profileMessage" class="profile-notice" role="status" aria-live="polite"></div>
      <div class="profile-form-actions">
        <button class="btn btn-primary" type="submit" id="saveProfileButton">保存修改</button>
        <button class="btn btn-outline" type="button" data-close-panel id="cancelProfileButton">取消</button>
      </div>
    </form>
  </section>

  <section class="profile-panel" id="passwordPanel" hidden>
    <h2 id="passwordPanelTitle">修改密码</h2>
    <form id="passwordForm" novalidate>
      <div class="form-group">
        <label for="currentPassword" id="currentPasswordLabel">当前密码</label>
        <input id="currentPassword" name="current_password" type="password" maxlength="128" autocomplete="current-password" required>
      </div>
      <div class="form-group">
        <label for="newPassword" id="newPasswordLabel">新密码</label>
        <input id="newPassword" name="new_password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
        <div class="profile-help" id="passwordHelp">至少 6 个字符，并且不能与当前密码相同。</div>
      </div>
      <div class="form-group">
        <label for="confirmPassword" id="confirmPasswordLabel">再次输入新密码</label>
        <input id="confirmPassword" name="confirm_password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      </div>
      <div id="passwordMessage" class="profile-notice" role="status" aria-live="polite"></div>
      <div class="profile-form-actions">
        <button class="btn btn-primary" type="submit" id="savePasswordButton">更新密码</button>
        <button class="btn btn-outline" type="button" data-close-panel id="cancelPasswordButton">取消</button>
      </div>
    </form>
  </section>

  <aside class="mobile-guide" style="margin-top:0.9rem">
    <strong id="privacyTitle">账户安全提示</strong>
    <span id="privacyCopy">不要把密码告诉他人。模型结果用于辅助判断，严重病害请联系农艺师。</span>
  </aside>

  <button class="btn btn-outline profile-danger" style="width:100%;margin-top:1rem" type="button" id="logoutButton">退出登录</button>
</main>

<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <a href="mobile.html"><span aria-hidden="true">⌂</span><b id="navHome">首页</b></a>
  <a href="history.html"><span aria-hidden="true">◷</span><b id="navHistory">历史</b></a>
  <a class="active" href="profile.html" aria-current="page"><span aria-hidden="true">○</span><b id="navMine">我的</b></a>
</nav>

<script src="../js/api.js?v=20260803-1"></script>
<script src="../js/auth.js?v=20260803-1"></script>
<script src="../js/mobile.js?v=20260803-1"></script>
<script src="../js/pwa.js"></script>
<script>
if (!requireRole(["Farmer"])) throw new Error('Access denied');

const PROFILE_COPY = {
  "zh-CN": {
    back:"‹ 返回首页", title:"我的账户", intro:"查看资料，安全地修改登录信息。", role:"农民用户 · Farmer",
    email:"登录邮箱", language:"显示语言", languageValue:"中文", edit:"修改姓名或邮箱", changePassword:"修改密码",
    profileTitle:"修改姓名或邮箱", name:"姓名", profilePassword:"当前密码",
    profileHelp:"用于确认是你本人操作，我们不会保存明文密码。", saveProfile:"保存修改", cancel:"取消",
    passwordTitle:"修改密码", currentPassword:"当前密码", newPassword:"新密码", confirmPassword:"再次输入新密码",
    passwordHelp:"至少 6 个字符，并且不能与当前密码相同。", savePassword:"更新密码",
    privacyTitle:"账户安全提示", privacy:"不要把密码告诉他人。模型结果用于辅助判断，严重病害请联系农艺师。",
    logout:"退出登录", home:"首页", history:"历史", mine:"我的", required:"请把所有项目填写完整。",
    invalidEmail:"请输入有效的邮箱地址。", mismatch:"两次输入的新密码不一致。", tooShort:"新密码至少需要 6 个字符。",
    saving:"正在保存，请稍候…", profileSaved:"资料已保存。下次登录请使用新的邮箱。",
    passwordSaved:"密码已修改。为了保护账号，即将返回登录页，请使用新密码登录。",
    wrongPassword:"当前密码不正确，请重新输入。", emailExists:"这个邮箱已被使用，请换一个邮箱。",
    network:"网络连接中断，已保留你填写的内容。请联网后重试。", generic:"暂时无法保存，请稍后重试。"
  },
  en: {
    back:"‹ Back home", title:"My account", intro:"Review your details and safely update sign-in information.", role:"Farmer account",
    email:"Sign-in email", language:"Display language", languageValue:"English", edit:"Edit name or email", changePassword:"Change password",
    profileTitle:"Edit name or email", name:"Name", profilePassword:"Current password",
    profileHelp:"This confirms it is really you. We never store your plain password.", saveProfile:"Save changes", cancel:"Cancel",
    passwordTitle:"Change password", currentPassword:"Current password", newPassword:"New password", confirmPassword:"Enter new password again",
    passwordHelp:"Use at least 6 characters and choose a password different from the current one.", savePassword:"Update password",
    privacyTitle:"Account safety", privacy:"Do not share your password. Model results support decisions; contact an agronomist for serious disease.",
    logout:"Sign out", home:"Home", history:"History", mine:"My account", required:"Please complete every field.",
    invalidEmail:"Enter a valid email address.", mismatch:"The two new passwords do not match.", tooShort:"The new password needs at least 6 characters.",
    saving:"Saving…", profileSaved:"Your details were saved. Use the new email the next time you sign in.",
    passwordSaved:"Password changed. For your safety, you will return to sign-in and use the new password.",
    wrongPassword:"The current password is incorrect. Please try again.", emailExists:"That email is already in use. Please choose another.",
    network:"The connection was interrupted. Your entries are still here; reconnect and try again.", generic:"Changes could not be saved. Please try again."
  }
};

const byId = id => document.getElementById(id);
const copy = () => PROFILE_COPY[mobileLanguage()];

function renderAccount() {
  const text = copy();
  const user = currentUser() || {};
  document.documentElement.lang = mobileLanguage();
  byId('languageSelect').value = mobileLanguage();
  byId('profileName').textContent = user.name || '—';
  byId('profileEmail').textContent = user.email || '—';
  byId('accountName').value = user.name || '';
  byId('accountEmail').value = user.email || '';
  const values = {
    backHome:'back', pageTitle:'title', pageIntro:'intro', profileRole:'role', emailLabel:'email', languageLabel:'language',
    profileLanguage:'languageValue', editProfileButton:'edit', changePasswordButton:'changePassword', profilePanelTitle:'profileTitle',
    nameLabel:'name', newEmailLabel:'email', profilePasswordLabel:'profilePassword', profilePasswordHelp:'profileHelp',
    saveProfileButton:'saveProfile', cancelProfileButton:'cancel', passwordPanelTitle:'passwordTitle', currentPasswordLabel:'currentPassword',
    newPasswordLabel:'newPassword', confirmPasswordLabel:'confirmPassword', passwordHelp:'passwordHelp', savePasswordButton:'savePassword',
    cancelPasswordButton:'cancel', privacyTitle:'privacyTitle', privacyCopy:'privacy', logoutButton:'logout', navHome:'home', navHistory:'history', navMine:'mine'
  };
  Object.entries(values).forEach(([id, key]) => { byId(id).textContent = text[key]; });
  bindNetworkStatus();
}

function closePanels() {
  byId('profilePanel').hidden = true;
  byId('passwordPanel').hidden = true;
  byId('profileMessage').innerHTML = '';
  byId('passwordMessage').innerHTML = '';
}

function openPanel(id) {
  closePanels();
  byId(id).hidden = false;
  byId(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
  byId(id).querySelector('input')?.focus({ preventScroll: true });
}

function showMessage(id, type, message) {
  byId(id).innerHTML = `<div class="alert alert-${type}">${esc(message)}</div>`;
}

function localizedError(result) {
  const text = copy();
  if (result.status === 0) return text.network;
  if (result.status === 409) return text.emailExists;
  if (result.status === 401) return text.wrongPassword;
  return result.error || text.generic;
}

function setBusy(button, busy, busyLabel, normalLabel) {
  button.disabled = busy;
  button.setAttribute('aria-busy', String(busy));
  button.textContent = busy ? busyLabel : normalLabel;
}

byId('editProfileButton').addEventListener('click', () => openPanel('profilePanel'));
byId('changePasswordButton').addEventListener('click', () => openPanel('passwordPanel'));
document.querySelectorAll('[data-close-panel]').forEach(button => button.addEventListener('click', closePanels));
byId('logoutButton').addEventListener('click', () => confirmLogout(mobileLanguage()));

byId('languageSelect').addEventListener('change', event => {
  setMobileLanguage(event.target.value);
  renderAccount();
});

byId('profileForm').addEventListener('submit', async event => {
  event.preventDefault();
  const text = copy();
  const name = byId('accountName').value.trim();
  const email = byId('accountEmail').value.trim().toLowerCase();
  const currentPassword = byId('profileCurrentPassword').value;
  if (!name || !email || !currentPassword) return showMessage('profileMessage', 'warning', text.required);
  if (!byId('accountEmail').checkValidity()) return showMessage('profileMessage', 'warning', text.invalidEmail);

  const button = byId('saveProfileButton');
  setBusy(button, true, text.saving, text.saveProfile);
  const result = await apiPatch('/api/auth/profile', { name, email, current_password: currentPassword });
  setBusy(button, false, text.saving, text.saveProfile);
  if (!result.ok) return showMessage('profileMessage', 'error', localizedError(result));

  setSession(result.data.user, result.data.access_token);
  byId('profileCurrentPassword').value = '';
  renderAccount();
  showMessage('profileMessage', 'success', text.profileSaved);
});

byId('passwordForm').addEventListener('submit', async event => {
  event.preventDefault();
  const text = copy();
  const currentPassword = byId('currentPassword').value;
  const newPassword = byId('newPassword').value;
  const confirmPassword = byId('confirmPassword').value;
  if (!currentPassword || !newPassword || !confirmPassword) return showMessage('passwordMessage', 'warning', text.required);
  if (newPassword.length < 6) return showMessage('passwordMessage', 'warning', text.tooShort);
  if (newPassword !== confirmPassword) return showMessage('passwordMessage', 'warning', text.mismatch);

  const button = byId('savePasswordButton');
  setBusy(button, true, text.saving, text.savePassword);
  const result = await apiPost('/api/auth/change-password', {
    current_password: currentPassword,
    new_password: newPassword,
    confirm_password: confirmPassword,
  });
  setBusy(button, false, text.saving, text.savePassword);
  if (!result.ok) return showMessage('passwordMessage', 'error', localizedError(result));

  showMessage('passwordMessage', 'success', text.passwordSaved);
  clearSession();
  setTimeout(() => { location.href = 'login.html?password_changed=1'; }, 1700);
});

(async function initializeProfile() {
  renderAccount();
  if (await validateSession()) renderAccount();
})();
</script>
</body>
</html>
