function at(key) {
  return agronomyText[agronomyLanguage][key] || agronomyText.en[key] || key;
}

function aesc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('"', '&quot;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function activeAgronomyTab() {
  return document.querySelector('#tabs .tab.active')?.dataset.tab || 'health';
}

function applyAgronomyLanguage() {
  document.documentElement.lang = agronomyLanguage;
  document.getElementById('agronomyLanguage').value = agronomyLanguage;
  document.getElementById('agronomyTitle').textContent = at('title');
  document.getElementById('agronomySubtitle').textContent = at('subtitle');
  document.getElementById('languageLabel').textContent = at('language');
  document.getElementById('tabHealth').textContent = at('health');
  document.getElementById('tabDiagnosis').textContent = at('diagnosis');
  document.getElementById('tabGrowth').textContent = at('growth');
  document.getElementById('tabAlerts').textContent = at('alerts');
  document.getElementById('tabDashboard').textContent = at('dashboard');
  document.getElementById('tabInsights').textContent = at('insights');
}

document.getElementById('agronomyLanguage').addEventListener('change', async function() {
  agronomyLanguage = this.value;
  localStorage.setItem('agronomy_language', agronomyLanguage);
  applyAgronomyLanguage();
  const active = activeAgronomyTab();
  renderTab(active);
  if (active === 'diagnosis' && diagnosisDraftFile && latestDiagnosis) {
    await submitDiseaseDiagnosis(true);
  }
});

applyAgronomyLanguage();

document.getElementById('tabs').addEventListener('click', function(event) {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
  tab.classList.add('active');
  renderTab(tab.dataset.tab);
});

async function loadFields() {
  const result = await apiGet('/api/fields');
  fields = result.ok && Array.isArray(result.data.fields)
    ? result.data.fields.map(normalizeField)
    : [];
  renderTab('health');
}

function normalizeField(field) {
  return {
    fieldId: field.field_id ?? field.fieldId,
    fieldName: field.field_name ?? field.fieldName,
    location: field.location,
    latestAvgCount: Number(field.latest_avg_count ?? field.latestAvgCount ?? 0),
    baselineCount: Number(field.baseline_count ?? field.baselineCount ?? 0),
    healthStatus: field.health_status ?? field.healthStatus ?? 'Healthy',
    anomalyFlag: Boolean(field.anomaly_flag ?? field.anomalyFlag),
  };
}

function renderTab(type) {
  const el = document.getElementById('tabContent');
  if (type === 'diagnosis') {
    renderDiagnosisTab();
    return;
  }
  if (type === 'dashboard') {
    el.innerHTML = '<div class="form-group" style="max-width:260px;"><label>Filter by Region</label>' +
      '<select id="regionFilter"><option value="">All Regions</option><option>North Region</option><option>East Region</option><option>South Region</option></select></div>' +
      '<div class="field-grid" id="fieldGrid">' + renderFieldCards(fields) + '</div>';
    el.querySelector('#regionFilter').onchange = async function() {
      const selected = this.value;
      const response = await apiGet('/api/fields' + (selected ? '?region=' + encodeURIComponent(selected) : ''));
      const visible = response.ok ? response.data.fields.map(normalizeField) : fields;
      el.querySelector('#fieldGrid').innerHTML = renderFieldCards(visible);
    };
    return;
  }
  if (type === 'health') {
    if (!fields.length) {
      el.innerHTML = '<div class="alert alert-warning">' + esc(at('fieldUnavailable')) + '</div>';
      return;
    }
    el.innerHTML = '<div class="card"><div class="form-group"><label>Select Field</label><select id="healthField">' +
      fields.map(field => '<option value="' + field.fieldId + '">' + esc(field.fieldName) + '</option>').join('') +
      '</select></div><div id="healthResult"></div></div>';
    el.querySelector('#healthField').onchange = loadHealth;
    loadHealth();
    return;
  }
  if (type === 'growth') {
    el.innerHTML = '<div class="card"><div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:end;">' +
      '<div class="form-group"><label>Field</label><select id="growthField">' +
      fields.map(field => '<option value="' + field.fieldId + '">' + esc(field.fieldName) + '</option>').join('') +
      '</select></div><div class="form-group"><label>Weeks</label><select id="growthWeeks"><option>2</option><option selected>4</option><option>8</option></select></div>' +
      '<button class="btn btn-primary" id="loadGrowth">Load Trend</button></div><div id="growthChart"></div></div>';
    el.querySelector('#loadGrowth').onclick = loadGrowth;
    loadGrowth();
    return;
  }
  if (type === 'alerts') {
    el.innerHTML = '<div class="card"><h3 style="color:var(--green);">Abnormal Pattern Review</h3>' +
      '<div id="alertList"><span class="spinner"></span> Scanning all fields...</div></div>';
    loadAlerts();
    return;
  }
  el.innerHTML = '<div class="card"><h3 style="color:var(--green);">Summarized Insights</h3><div id="insights"><span class="spinner"></span> Loading...</div>' +
    '<button class="btn btn-outline" id="exportInsights">Export Summary</button></div>';
  el.querySelector('#exportInsights').onclick = exportInsights;
  loadInsights();
}

function renderDiagnosisTab() {
  const el = document.getElementById('tabContent');
  const preview = diagnosisPreviewUrl

    : '<div id="leafPreviewPrompt"><strong>' + esc(at('choosePhoto')) + '</strong><br><small>JPG / PNG · max 10 MB</small></div>';
  const retained = diagnosisDraftFile
    ? '<p class="info-text" id="retainedPhoto">' + esc(at('retainedPhoto')) + ': <strong>' + esc(diagnosisDraftFile.name) + '</strong></p>'
    : '<p class="info-text" id="retainedPhoto"></p>';
  el.innerHTML =
    '<div class="diagnosis-shell">' +
      '<section class="diagnosis-panel" aria-labelledby="leafAssistantTitle">' +
        '<h3 id="leafAssistantTitle">' + esc(at('assistantTitle')) + '</h3>' +
        '<p>' + esc(at('assistantIntro')) + '</p>' +
        '<div class="photo-guide" aria-label="Photo guidance">' +
          '<div class="photo-guide-item"><strong>' + esc(at('guideLight')) + '</strong>' + esc(at('guideLightBody')) + '</div>' +
          '<div class="photo-guide-item"><strong>' + esc(at('guideLeaf')) + '</strong>' + esc(at('guideLeafBody')) + '</div>' +
          '<div class="photo-guide-item"><strong>' + esc(at('guideSteady')) + '</strong>' + esc(at('guideSteadyBody')) + '</div>' +
        '</div>' +
        '<form id="diseaseDiagnosisForm">' +
          '<label class="leaf-dropzone">' + preview +
            '<input id="leafPhoto" type="file" accept="image/jpeg,image/png" capture="environment" aria-label="' + aesc(at('choosePhoto')) + '">' +
          '</label>' + retained +
          '<div class="form-group"><label for="diagnosisField">' + esc(at('field')) + '</label>' +
            '<select id="diagnosisField"><option value="">' + esc(at('noField')) + '</option>' +
              fields.map(field => '<option value="' + field.fieldId + '"' +
                (String(diagnosisDraftContext.field_id || '') === String(field.fieldId) ? ' selected' : '') +
                '>' + esc(field.fieldName) + '</option>').join('') +
            '</select></div>' +
          '<div class="form-group"><label for="cropStage">' + esc(at('cropStage')) + '</label>' +
            '<input id="cropStage" maxlength="200" placeholder="' + aesc(at('cropStageHint')) + '" value="' +
              aesc(diagnosisDraftContext.crop_stage || '') + '"></div>' +
          '<div class="form-group"><label for="recentWeather">' + esc(at('weather')) + '</label>' +
            '<input id="recentWeather" maxlength="500" placeholder="' + aesc(at('weatherHint')) + '" value="' +
              aesc(diagnosisDraftContext.recent_weather || '') + '"></div>' +
          '<div class="form-group"><label for="symptomSpread">' + esc(at('spread')) + '</label>' +
            '<textarea id="symptomSpread" rows="2" maxlength="500" placeholder="' + aesc(at('spreadHint')) + '">' +
              esc(diagnosisDraftContext.symptom_spread || '') + '</textarea></div>' +
          '<button class="btn btn-primary" type="submit" id="diagnoseButton">' + esc(at('analyse')) + '</button>' +
          '<div id="diagnosisProgress" role="status" aria-live="polite"></div>' +
        '</form>' +
      '</section>' +
      '<aside id="diagnosisResult" aria-live="polite">' +
        (latestDiagnosis ? diagnosisResultHtml(latestDiagnosis) : '') +
      '</aside>' +
    '</div>' +
    '<section class="card agronomist-review-queue" aria-labelledby="reviewQueueTitle">' +
      '<div class="leaf-section-heading"><div><p class="eyebrow">Farmer requests</p>' +
      '<h2 id="reviewQueueTitle">Assigned Leaf Review Queue</h2></div>' +
      '<button class="btn btn-sm btn-outline" id="refreshReviewQueue" type="button">Refresh</button></div>' +
      '<p class="info-text">Only checks explicitly shared by Farmers from fields assigned to you appear here.</p>' +
      '<div id="diseaseReviewQueue" class="agronomist-review-list" aria-live="polite"></div>' +
    '</section>';

  document.getElementById('leafPhoto').addEventListener('change', function() {
    const file = this.files && this.files[0];
    if (!file) return;
    diagnosisDraftFile = file;
    if (diagnosisPreviewUrl) URL.revokeObjectURL(diagnosisPreviewUrl);
    diagnosisPreviewUrl = URL.createObjectURL(file);
    const dropzone = this.closest('.leaf-dropzone');
    const existing = dropzone.querySelector('.leaf-preview, #leafPreviewPrompt');
    existing.outerHTML = '<img class="leaf-preview" id="leafPreview" src="' + diagnosisPreviewUrl + '" alt="Selected maize leaf">';
    document.getElementById('retainedPhoto').innerHTML =
      esc(at('retainedPhoto')) + ': <strong>' + esc(file.name) + '</strong>';
  });
  document.getElementById('diseaseDiagnosisForm').addEventListener('submit', function(event) {
    event.preventDefault();
    submitDiseaseDiagnosis(false);
  });
  wireDiseaseReviewControls();
  document.getElementById('refreshReviewQueue').addEventListener('click', loadDiseaseReviewQueue);
  loadDiseaseReviewQueue();
}

function reviewQueueElement(tag, className, value) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (value !== undefined) element.textContent = String(value);
  return element;
}

function reviewDecisionForm(record) {
  const form = reviewQueueElement('form', 'review-queue-form');
  const decisionLabel = reviewQueueElement('label', '', 'Professional decision');
  const decision = reviewQueueElement('select');
  decision.name = 'decision';
  [['confirmed', 'Confirm model result'], ['corrected', 'Correct the result'], ['inconclusive', 'Inconclusive']]
    .forEach(([value, label]) => decision.append(new Option(label, value)));
  decisionLabel.append(decision);
  const conditionLabel = reviewQueueElement('label', '', 'Reviewed condition');
  const condition = reviewQueueElement('select');
  condition.name = 'reviewed_condition';
  [['healthy', 'No supported disease clearly detected'], ['common_rust', 'Common rust'],
   ['gray_leaf_spot', 'Gray leaf spot'], ['northern_leaf_blight', 'Northern corn leaf blight'],
   ['other', 'Other / needs field inspection']].forEach(([value, label]) => condition.append(new Option(label, value)));
  conditionLabel.append(condition);
  conditionLabel.hidden = true;
  decision.addEventListener('change', () => { conditionLabel.hidden = decision.value !== 'corrected'; });
  const noteLabel = reviewQueueElement('label', '', 'Farmer-friendly review note');
  const note = reviewQueueElement('textarea');
  note.name = 'note';
  note.rows = 3;
  note.maxLength = 2000;
  note.required = true;
  note.placeholder = 'Explain what you observed and the safest next step.';
  noteLabel.append(note);
  const submit = reviewQueueElement('button', 'btn btn-primary', 'Complete review');
  submit.type = 'submit';
  const message = reviewQueueElement('p', 'form-message');
  form.append(decisionLabel, conditionLabel, noteLabel, submit, message);
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!note.value.trim()) { message.textContent = 'Add a short explanation for the Farmer.'; return; }
    submit.disabled = true;
    message.textContent = 'Saving review…';
    const response = await apiReviewDiseaseDiagnosis(record.diagnosis_id, {
      decision: decision.value,
      reviewed_condition: condition.value,
      note: note.value.trim(),
    });
    if (!response.ok) {
      submit.disabled = false;
      message.textContent = response.error || 'Review could not be saved.';
      return;
    }
    await loadDiseaseReviewQueue();
  });
  return form;
}

function renderDiseaseReviewQueue(records) {
  const root = document.getElementById('diseaseReviewQueue');
  if (!root) return;
  root.replaceChildren();
  if (!records.length) {
    root.append(reviewQueueElement('p', 'info-text', 'No Farmer review requests are waiting.'));
    return;
  }
  records.forEach(record => {
    const item = reviewQueueElement('article', 'agronomist-review-item');
    const heading = reviewQueueElement('div', 'leaf-section-heading');
    const titleGroup = reviewQueueElement('div');
    titleGroup.append(
      reviewQueueElement('strong', '', record.condition_name || record.headline || 'Leaf screening'),
      reviewQueueElement('p', 'info-text', record.created_at ? new Date(record.created_at).toLocaleString() : '')
    );
    heading.append(titleGroup, reviewQueueElement('span', `review-status review-status-${record.review_status}`, String(record.review_status || '').replace('_', ' ')));
    item.append(heading);
    if (record.review_request_reason) item.append(reviewQueueElement('p', 'review-request-reason', `Farmer's question: ${record.review_request_reason}`));
    if (record.review_status === 'requested') {
      const start = reviewQueueElement('button', 'btn btn-outline', 'Start review');
      start.type = 'button';
      start.addEventListener('click', async () => {
        start.disabled = true;
        const response = await apiStartDiseaseReview(record.diagnosis_id);
        if (!response.ok) { start.disabled = false; start.textContent = response.error || 'Could not start review'; return; }
        await loadDiseaseReviewQueue();
      });
      item.append(start);
    } else if (record.review_status === 'in_review') {
      item.append(reviewDecisionForm(record));
    } else if (record.review_status === 'reviewed') {
      const note = reviewQueueElement('p', 'leaf-review-note');
      note.append(reviewQueueElement('b', '', 'Saved review: '), document.createTextNode(record.reviewer_note || 'Completed'));
      item.append(note);
    }
    root.append(item);
  });
}

async function loadDiseaseReviewQueue() {
  const root = document.getElementById('diseaseReviewQueue');
  if (!root) return;
  root.textContent = 'Loading Farmer requests…';
  const response = await apiGet('/api/agronomy/diagnoses');
  if (!response.ok) { root.textContent = response.error || 'Review queue could not be loaded.'; return; }
  renderDiseaseReviewQueue(Array.isArray(response.data.records) ? response.data.records : []);
}

async function submitDiseaseDiagnosis(silentLanguageRefresh) {
  if (!diagnosisDraftFile) {
    const progress = document.getElementById('diagnosisProgress');
    if (progress) progress.innerHTML = '<div class="alert alert-warning">' + esc(at('noPhoto')) + '</div>';
    return;
  }
  diagnosisDraftContext = {
    field_id: document.getElementById('diagnosisField')?.value || diagnosisDraftContext.field_id || '',
    crop_stage: document.getElementById('cropStage')?.value.trim() || diagnosisDraftContext.crop_stage || '',
    recent_weather: document.getElementById('recentWeather')?.value.trim() || diagnosisDraftContext.recent_weather || '',
    symptom_spread: document.getElementById('symptomSpread')?.value.trim() || diagnosisDraftContext.symptom_spread || '',
    language: agronomyLanguage
  };
  const progress = document.getElementById('diagnosisProgress');
  const button = document.getElementById('diagnoseButton');
  if (button) button.disabled = true;
  const steps = [at('checking'), at('analysing'), at('preparing')];
  let step = 0;
  if (progress && !silentLanguageRefresh) {
    progress.innerHTML = '<div class="diagnosis-progress"><span class="spinner"></span> ' + esc(steps[0]) + '</div>';
  }
  const ticker = setInterval(() => {
    step = Math.min(step + 1, steps.length - 1);
    if (progress) {
      progress.innerHTML = '<div class="diagnosis-progress"><span class="spinner"></span> ' + esc(steps[step]) + '</div>';
    }
  }, 900);

  const result = await apiDiagnoseDisease(diagnosisDraftFile, diagnosisDraftContext);
  clearInterval(ticker);
  if (button) button.disabled = false;
  if (progress) progress.innerHTML = '';
  if (!result.ok) {
    const message = result.status === 503 ? at('serviceError') : (result.error || at('tryAgain'));
    const resultElement = document.getElementById('diagnosisResult');
    if (resultElement) {
      resultElement.innerHTML =
        '<div class="alert alert-warning"><strong>' + esc(message) + '</strong></div>';
    }
    return;
  }
  latestDiagnosis = result.data;
  const resultElement = document.getElementById('diagnosisResult');
  if (resultElement) {
    resultElement.innerHTML = diagnosisResultHtml(latestDiagnosis);
    wireDiseaseReviewControls();
  }
}

function diagnosisResultHtml(result) {
  const list = items => (items || []).length
    ? '<ul>' + items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>'
    : '';
  const condition = result.possible_condition;
  const conditionBlock = condition
    ? '<div class="diagnosis-section"><h4>' + esc(at('condition')) + '</h4>' +
      '<p><strong>' + esc(condition.display_name) + '</strong></p>' +
      '<span class="confidence-language">' + esc(at(condition.confidence_band)) + '</span></div>'
    : '';
  const persistenceText = result.persistence?.status === 'saved' ? at('saved') : at('saveFailed');
  const reviewBlock = result.review_status === 'in_review' && result.diagnosis_id
    ? '<div class="diagnosis-section" id="diseaseReviewBox"><h4>' + esc(at('reviewTitle')) + '</h4>' +
      '<div class="form-group"><label for="diseaseReviewDecision">' + esc(at('decision')) + '</label>' +
        '<select id="diseaseReviewDecision"><option value="confirmed">' + esc(at('confirmed')) + '</option>' +
        '<option value="corrected">' + esc(at('corrected')) + '</option>' +
        '<option value="inconclusive">' + esc(at('inconclusive')) + '</option></select></div>' +
      '<div class="form-group" id="reviewedConditionGroup" style="display:none;"><label for="reviewedCondition">' + esc(at('reviewedCondition')) + '</label>' +
        '<select id="reviewedCondition">' +
          '<option value="healthy">' + esc(agronomyLanguage === 'zh-CN' ? '暂未发现已支持病害' : 'No supported disease clearly detected') + '</option>' +
          '<option value="common_rust">' + esc(agronomyLanguage === 'zh-CN' ? '玉米普通锈病' : 'Common rust') + '</option>' +
          '<option value="gray_leaf_spot">' + esc(agronomyLanguage === 'zh-CN' ? '玉米灰斑病' : 'Gray leaf spot') + '</option>' +
          '<option value="northern_leaf_blight">' + esc(agronomyLanguage === 'zh-CN' ? '玉米大斑病' : 'Northern corn leaf blight') + '</option>' +
          '<option value="other">' + esc(at('otherCondition')) + '</option></select></div>' +
      '<div class="form-group"><label for="diseaseReviewNote">' + esc(at('reviewNote')) + '</label>' +
        '<textarea id="diseaseReviewNote" rows="2" maxlength="2000" placeholder="' + aesc(at('reviewNoteHint')) + '"></textarea></div>' +
      '<button class="btn btn-outline" type="button" onclick="saveDiseaseReview(' + Number(result.diagnosis_id) + ')">' +
        esc(at('saveReview')) + '</button><div id="diseaseReviewMessage" role="status"></div></div>'
    : '';
  return '<article class="diagnosis-result">' +
    '<h3>' + esc(result.headline || '') + '</h3>' +
    conditionBlock +
    '<div class="diagnosis-section"><h4>' + esc(at('observed')) + '</h4>' + list(result.observation) + '</div>' +
    ((result.follow_up_questions || []).length
      ? '<div class="diagnosis-section"><h4>' + esc(at('questions')) + '</h4>' + list(result.follow_up_questions) + '</div>'
      : '') +
    '<div class="diagnosis-section"><h4>' + esc(at('next')) + '</h4>' + list(result.next_steps) + '</div>' +
    '<div class="diagnosis-safety">' + esc(result.safety_note || '') + '</div>' +
    '<p class="info-text" style="color:#dff0b7;">' + esc(persistenceText) + '</p>' +
    reviewBlock +
    '<details class="diagnosis-technical"><summary>' + esc(at('technical')) + '</summary><pre>' +
      esc(JSON.stringify(result.technical || {}, null, 2)) + '</pre></details>' +
    '</article>';
}

function wireDiseaseReviewControls() {
  const decision = document.getElementById('diseaseReviewDecision');
  const conditionGroup = document.getElementById('reviewedConditionGroup');
  if (!decision || !conditionGroup) return;
  const sync = () => {
    conditionGroup.style.display = decision.value === 'corrected' ? 'block' : 'none';
  };
  decision.addEventListener('change', sync);
  sync();
}

async function saveDiseaseReview(diagnosisId) {
  const decision = document.getElementById('diseaseReviewDecision').value;
  const reviewedCondition = document.getElementById('reviewedCondition').value;
  const note = document.getElementById('diseaseReviewNote').value.trim();
  const message = document.getElementById('diseaseReviewMessage');
  if (!note) {
    message.innerHTML = '<div class="alert alert-warning">' + esc(at('reviewNoteHint')) + '</div>';
    return;
  }
  const result = await apiReviewDiseaseDiagnosis(diagnosisId, {
    decision,
    reviewed_condition: reviewedCondition,
    note
  });
  message.innerHTML = '<div class="alert ' + (result.ok ? 'alert-success' : 'alert-warning') + '">' +
    esc(result.ok ? at('reviewSaved') : at('reviewFailed')) + '</div>';
}

function renderFieldCards(items) {
  return items.map(field => {
    const warning = field.anomalyFlag || field.healthStatus !== 'Healthy';
    return '<div class="card" style="text-align:center;border:2px solid ' + (warning ? 'var(--red)' : 'var(--green-light)') + ';">' +
      '<h3>' + esc(field.fieldName) + '</h3><p class="info-text">' + esc(field.location) + '</p>' +
      '<div style="font-size:2rem;font-weight:700;color:' + (warning ? 'var(--red)' : 'var(--green)') + ';">' + field.latestAvgCount + '</div>' +
      '<div>Average Tassel Count</div><span class="badge ' + (warning ? 'badge-red' : 'badge-green') + '">' +
      (warning ? 'Review' : 'Healthy') + '</span></div>';
  }).join('');
}

// USER STORY C.1 Control call: evaluate field health.
async function loadHealth() {
  const fieldId = document.getElementById('healthField').value;
  if (!fieldId) return;
  const result = await apiGet('/api/fields/' + fieldId + '/health');
  if (!result.ok) return;
  const data = result.data;
  document.getElementById('healthResult').innerHTML =
    '<div class="card-grid"><div class="stat-card"><div class="value">' + data.field.latest_avg_count + '</div><div class="label">Latest Count</div></div>' +
    '<div class="stat-card"><div class="value">' + data.field.baseline_count + '</div><div class="label">Baseline</div></div>' +
    '<div class="stat-card"><div class="value">' + esc(data.health) + '</div><div class="label">Health Status</div></div></div>' +
    '<div class="alert alert-warning">' + esc(data.recommendation) + '</div>' +
    '<div class="form-group"><label>Recommendation Note</label><textarea id="recommendationNote" rows="3"></textarea></div>' +
    '<button class="btn btn-primary" onclick="saveRecommendation(' + fieldId + ')">Save Recommendation</button> <span id="recommendationMsg"></span>';
}

// USER STORY C.1 Control call: persist an agronomist recommendation.
async function saveRecommendation(fieldId) {
  const note = document.getElementById('recommendationNote').value.trim();
  if (!note) return;
  const result = await apiPost('/api/fields/' + fieldId + '/recommendations', { note });
  document.getElementById('recommendationMsg').textContent = result.ok ? 'Saved.' : 'Save failed.';
}

function openHealth(fieldId) {
  document.querySelector('[data-tab="health"]').click();
  document.getElementById('healthField').value = String(fieldId);
  loadHealth();
}

// USER STORY C.2 Control call: load weekly field growth.
async function loadGrowth() {
  const fieldId = document.getElementById('growthField').value;
  const weeks = document.getElementById('growthWeeks').value;
  const result = await apiGet('/api/fields/' + fieldId + '/growth?weeks=' + weeks);
  if (!result.ok) return;
  const trend = result.data.trend;
  const max = Math.max(...trend, 1);
  document.getElementById('growthChart').innerHTML =
    '<div style="display:flex;align-items:end;gap:1rem;height:220px;padding:1rem;background:var(--gray-50);">' +
    trend.map((value, index) => '<div style="text-align:center;flex:1;"><div style="height:' +
      Math.max(20, value / max * 160) + 'px;background:var(--green);border-radius:6px 6px 0 0;"></div><small>' +
      esc((result.data.labels || [])[index] || String(index + 1)) + ' (' + value + ')</small></div>').join('') + '</div><p>Growth rate: <strong>' +
    result.data.growth_rate + ' tassels/week</strong></p>';
}

// USER STORY C.3 Control call: scan abnormal field patterns.
async function loadAlerts() {
  const result = await apiGet('/api/fields/anomalies');
  if (!result.ok) return;
  const alerts = result.data.anomalies.map(normalizeField);
  document.getElementById('alertList').innerHTML = alerts.length ? alerts.map(field =>
    '<div class="alert alert-warning"><strong>' + esc(field.fieldName) + '</strong>: latest ' +
    field.latestAvgCount + ', baseline ' + field.baselineCount +
    '. <button class="btn btn-sm btn-outline" onclick="requestAnomalyReview(' + field.fieldId + ')">Request Review</button></div>'
  ).join('') : '<div class="alert alert-success">No abnormal fields detected.</div>';
}

// USER STORY C.3 Control call: save the anomaly review reason.
async function requestAnomalyReview(fieldId) {
  const reason = prompt('Reason for anomaly review:', 'Count is below the configured field threshold.');
  if (!reason) return;
  const result = await apiPost('/api/fields/' + fieldId + '/anomaly', { reason });
  alert(result.ok ? 'Field flagged and review request saved.' : 'Could not save review request.');
  if (result.ok) loadAlerts();
}

// USER STORY C.5 Control call: load summarized agronomy insights.
async function loadInsights() {
  const result = await apiGet('/api/fields/insights');
  if (!result.ok) return;
  latestInsights = result.data;
  document.getElementById('insights').innerHTML = result.data.insights.map(text =>
    '<div class="card" style="border-left:4px solid var(--green);">' + esc(text) + '</div>'
  ).join('') + '<div class="alert alert-warning"><strong>Recommendation:</strong> ' + esc(result.data.recommendation) + '</div>';
}

function exportInsights() {
  if (!latestInsights) return;
  const text = latestInsights.insights.join('\n') + '\n\nRecommendation: ' + latestInsights.recommendation;
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'agronomist-insights.txt';
  anchor.click();
  URL.revokeObjectURL(url);
}

loadFields();
</script>
