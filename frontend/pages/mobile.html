<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f5136">
<title>Maize Field Assistant / 玉米田间助手</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/maize-icon-192.png">
<link rel="apple-touch-icon" href="../icons/maize-icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mobile.css">
</head>
<body class="mobile-home">
<div id="networkStatus" class="network-status" role="status" hidden></div>

<header class="mobile-hero">
  <div style="display:flex;justify-content:space-between;gap:0.75rem;align-items:start">
    <div>
      <span id="greeting">下午好</span>
      <h1 id="homeQuestion">今天想检查什么？</h1>
    </div>
    <select id="languageSelect" aria-label="Language / 语言" style="min-height:44px;border-radius:12px;padding:0.45rem;background:#fff;color:#17251c;font-weight:750">
      <option value="zh-CN">中文</option>
      <option value="en">EN</option>
    </select>
  </div>
  <p id="homeIntro">拍照后由真实模型分析，结果会安全保存。</p>
  <div class="mobile-status-line"><span aria-hidden="true">●</span><span id="connectionCopy">网络良好 · 可以开始</span></div>
</header>

<main class="mobile-task-grid">
  <a class="mobile-task tassel" href="upload.html">
    <span class="mobile-task-icon" aria-hidden="true">🌽</span>
    <h2 id="tasselTitle">数一数玉米穗</h2>
    <p id="tasselBody">拍摄田间全景，自动标记并统计玉米穗。</p>
    <span class="mobile-task-action" id="tasselAction">拍照计数</span>
  </a>
  <a class="mobile-task leaf" href="leaf.html">
    <span class="mobile-task-icon" aria-hidden="true">🍃</span>
    <h2 id="leafTitle">看看叶片情况</h2>
    <p id="leafBody">拍清一片叶子，获得诚实、好理解的辅助判断。</p>
    <span class="mobile-task-action" id="leafAction">拍摄叶片</span>
  </a>
  <section class="mobile-capture-card" style="grid-column:1/-1">
    <h2 id="fieldTipTitle" style="font-size:1.15rem;color:var(--mobile-green)">田间使用小提醒</h2>
    <p id="fieldTip" style="margin:0;color:#344b39">信号较弱也没关系：上传时会显示进度，失败后可以在原页面重新尝试。</p>
    <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.9rem">
      <button class="btn btn-outline" type="button" data-install-app hidden onclick="installMaizeApp()" id="installButton">安装到手机</button>
    </div>
  </section>
</main>

<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <a class="active" href="mobile.html"><span aria-hidden="true">⌂</span><b id="navHome">首页</b></a>
  <a href="history.html"><span aria-hidden="true">◷</span><b id="navHistory">历史</b></a>
  <a href="profile.html"><span aria-hidden="true">○</span><b id="navMine">我的</b></a>
</nav>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/mobile.js"></script>
<script src="../js/pwa.js"></script>
<script>
if (!requireRole(["Farmer"])) throw new Error('Access denied');

const HOME_COPY = {
  "zh-CN": {
    question: "今天想检查什么？", intro: "拍照后由真实模型分析，结果会安全保存。",
    connection: "网络良好 · 可以开始", tasselTitle: "数一数玉米穗",
    tasselBody: "拍摄田间全景，自动标记并统计玉米穗。", tasselAction: "拍照计数",
    leafTitle: "看看叶片情况", leafBody: "拍清一片叶子，获得诚实、好理解的辅助判断。",
    leafAction: "拍摄叶片", tipTitle: "田间使用小提醒",
    tip: "信号较弱也没关系：上传时会显示进度，失败后可以在原页面重新尝试。",
    install: "安装到手机", logout: "退出登录", home: "首页", history: "历史", mine: "我的",
  },
  en: {
    question: "What would you like to check?", intro: "A real model analyses your photo and saves the result securely.",
    connection: "Online · Ready to start", tasselTitle: "Count maize tassels",
    tasselBody: "Photograph a field view to mark and count visible tassels.", tasselAction: "Take a field photo",
    leafTitle: "Check a maize leaf", leafBody: "Photograph one clear leaf for an honest, easy-to-read screening result.",
    leafAction: "Take a leaf photo", tipTitle: "A note for field use",
    tip: "Weak signal is okay: upload progress is visible, and a failed upload can be retried on the same page.",
    install: "Install on phone", logout: "Sign out", home: "Home", history: "History", mine: "My account",
  }
};

function renderHomeLanguage() {
  const language = mobileLanguage();
  setMobileLanguage(language);
  const copy = HOME_COPY[language];
  document.documentElement.lang = language;
  document.getElementById('languageSelect').value = language;
  const hour = new Date().getHours();
  document.getElementById('greeting').textContent = language === 'zh-CN'
    ? (hour < 12 ? '早上好' : hour < 18 ? '下午好' : '晚上好')
    : (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening');
  const ids = ['homeQuestion','homeIntro','connectionCopy','tasselTitle','tasselBody','tasselAction','leafTitle','leafBody','leafAction','fieldTipTitle','fieldTip','installButton','navHome','navHistory','navMine'];
  const keys = ['question','intro','connection','tasselTitle','tasselBody','tasselAction','leafTitle','leafBody','leafAction','tipTitle','tip','install','home','history','mine'];
  ids.forEach((id, index) => { document.getElementById(id).textContent = copy[keys[index]]; });
  bindNetworkStatus();
}

document.getElementById('languageSelect').addEventListener('change', event => {
  setMobileLanguage(event.target.value);
  renderHomeLanguage();
});
renderHomeLanguage();
</script>
</body>
</html>
