<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Maize Detector - Upload</title>
<link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>

<nav class="nav" id="mainNav"></nav>

<div class="container">
  <!-- USER STORY A.1 Boundary: select, validate, preview, and upload maize images. -->
  <h2 class="page-title">Upload Maize Image</h2>
  <p class="page-subtitle">Select maize field images for tassel detection (JPG / PNG only)</p>

  <!-- USER STORY A.5 Boundary: enable multiple-image batch upload. -->
  <div class="card" style="margin-bottom:1rem;">
    <label class="toggle">
      <input type="checkbox" id="batchMode" onchange="toggleBatch()">
      <strong>Batch Upload</strong> - select multiple images at once
    </label>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Select Image<small id="batchHint" style="display:none;"> - hold Ctrl/Cmd to select multiple</small></label>
      <!-- USER STORY A.7 Boundary: capture="environment" opens the rear camera on mobile. -->
      <input type="file" id="fileInput" accept="image/jpeg,image/png" capture="environment" onchange="handleFiles(this.files)" style="padding:0.5rem;">
    </div>

    <div class="preview-box" id="previewBox">
      <p style="color:var(--gray-500);">Preview will appear here after selecting an image</p>
    </div>
    <div id="fileInfo" class="info-text" style="margin-bottom:0.5rem;"></div>

    <!-- USER STORIES A.5/A.6 Boundary: batch progress and response-time feedback. -->
    <div id="batchProgress" style="display:none;margin:1rem 0;">
      <div style="display:flex;justify-content:space-between;margin-bottom:0.3rem;"><span>Uploading...</span><span id="progressText">0/0</span></div>
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%;"></div></div>
    </div>

    <div id="errorBox"></div>
    <p id="estimateText" class="info-text"></p>

    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;">
      <button class="btn btn-primary btn-lg" id="analyzeBtn" onclick="submitUpload()" disabled>
        Analyze
      </button>
      <button class="btn btn-outline" onclick="resetUpload()">Clear</button>
    </div>
  </div>

  <!-- Batch Results Summary (shown after batch analysis) -->
  <div id="batchSummary" style="display:none;">
    <div class="card" style="margin-top:1rem;">
      <h3 style="color:var(--green);margin-bottom:0.5rem;">Batch Results</h3>
      <p id="batchStats" style="color:var(--gray-500);margin-bottom:1rem;"></p>
      <div id="batchGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;"></div>
      <div id="batchPager" style="display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem;"></div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
setActiveNav();

if (!requireRole(["Farmer"])) throw new Error('Access denied');
initNav();


let selectedFiles = [];
let isBatch = false;

// USER STORY A.5 Control call preparation: switch between single and batch input.
function toggleBatch() {
  isBatch = document.getElementById('batchMode').checked;
  document.getElementById('fileInput').multiple = isBatch;
  document.getElementById('batchHint').style.display = isBatch ? 'inline' : 'none';
  document.getElementById('fileInput').value = '';
  selectedFiles = [];
  updatePreview();
}

// USER STORIES A.1/A.7 Boundary validation: accept mobile or desktop JPG/PNG files.
function handleFiles(files) {
  selectedFiles = [];
  document.getElementById('errorBox').innerHTML = '';
  const validTypes = ['image/jpeg', 'image/png'];
  const maxSize = 10 * 1024 * 1024;

  for (let f of files) {
    if (!validTypes.includes(f.type)) {
      showError(`${f.name}: Invalid type (${f.type || 'unknown'}). Only JPG/PNG accepted.`);
      continue;
    }
    if (f.size > maxSize) {
      showError(`${f.name}: File too large (${(f.size/1024/1024).toFixed(1)}MB). Max 10MB.`);
      continue;
    }
    selectedFiles.push(f);
  }
  updatePreview();
}

function updatePreview() {
  const box = document.getElementById('previewBox');
  const btn = document.getElementById('analyzeBtn');
  const info = document.getElementById('fileInfo');
  if (selectedFiles.length === 0) {
    box.innerHTML = '<p style="color:var(--gray-500);">Preview will appear here after selecting an image</p>';
    info.textContent = '';
    btn.disabled = true;
    return;
  }
  box.innerHTML = selectedFiles.map((f) =>
    `<div style="margin-bottom:1rem;"><p><strong>${esc(f.name)}</strong> (${(f.size/1024).toFixed(1)} KB)</p><img src="${URL.createObjectURL(f)}" alt="${esc(f.name)}"></div>`
  ).join('');
  info.textContent = `${selectedFiles.length} file(s) selected, ready to analyze`;
  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.innerHTML += `<div class="alert alert-error">${esc(msg)}</div>`;
}

function fileToDataUrl(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function uploadAndPredict(file) {
  const uploadRes = await apiUpload(file);
  if (!uploadRes.ok) {
    return { ok: false, error: uploadRes.error || 'Upload failed', fileName: file.name };
  }
  const imageId = uploadRes.data.image_id;
  const imageName = uploadRes.data.image_name || file.name;
  const predictRes = await apiPost('/api/predict', {
    image_id: imageId,
    image_name: imageName,
    file_size: file.size,
  });
  return predictRes.ok
    ? { ok: true, result: normalizeResult(predictRes.data) }
    : { ok: false, error: predictRes.error || 'Detection failed', fileName: file.name };
}

// USER STORIES A.5/A.6: process the queue and display progress/estimated time.
async function submitUpload() {
  if (selectedFiles.length === 0) return;
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Analyzing...';
  document.getElementById('estimateText').textContent =
    `Processing ${selectedFiles.length} image(s)...`;

  if (selectedFiles.length > 1) {
    const progDiv = document.getElementById('batchProgress');
    progDiv.style.display = 'block';
    let allResults = [];
    let failed = 0;
    for (let i = 0; i < selectedFiles.length; i++) {
      document.getElementById('progressText').textContent = `${i + 1}/${selectedFiles.length}`;
      document.getElementById('progressFill').style.width = ((i + 1) / selectedFiles.length * 100) + '%';
      const outcome = await uploadAndPredict(selectedFiles[i]);
      if (outcome.ok) {
        allResults.push({ name: selectedFiles[i].name, result: outcome.result });
      } else {
        failed++;
        showError(`${selectedFiles[i].name}: ${outcome.error}`);
      }
    }
    document.getElementById('batchProgress').style.display = 'none';
    document.getElementById('errorBox').innerHTML +=
      `<div class="alert ${failed ? 'alert-warning' : 'alert-success'}"><strong>Batch complete:</strong> ${allResults.length} successful, ${failed} failed.</div>`;

    if (allResults.length > 0) {
      sessionStorage.setItem('batchResults', JSON.stringify(allResults));
      sessionStorage.setItem('lastResult', JSON.stringify(allResults[allResults.length - 1].result));
      renderBatchSummary(allResults);
    }
    btn.disabled = false;
    btn.textContent = 'Analyze';
    document.getElementById('estimateText').textContent = '';
  } else {
    // Show elapsed time while waiting for inference
    const startTime = Date.now();
    const timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      btn.innerHTML = '<span class="spinner"></span> Analyzing (' + elapsed + 's)...<br><small style="color:#888">YOLO26s on CPU - may take 30-60s for large images</small>';
    }, 3000);
    const outcome = await uploadAndPredict(selectedFiles[0]);
    clearInterval(timerInterval);
    if (!outcome.ok) {
      showError(outcome.error);
      btn.disabled = false;
      btn.textContent = 'Analyze';
      document.getElementById('estimateText').textContent = '';
      return;
    }
    const result = outcome.result;
    sessionStorage.setItem('lastResult', JSON.stringify(result));
    // Store image preview for result page (skip if too large for sessionStorage)
    try {
      const previewUrl = await fileToDataUrl(selectedFiles[0]);
      if (previewUrl) sessionStorage.setItem('lastImageDataUrl', previewUrl);
    } catch (e) {
      console.warn('Image preview too large for sessionStorage, will load from backend');
    }
    document.getElementById('errorBox').innerHTML = '<div class="alert alert-success">Upload successful! Redirecting to result...</div>';
    setTimeout(() => location.href = 'result.html', 1000);
  }
  btn.disabled = false;
  btn.textContent = 'Analyze';
  document.getElementById('estimateText').textContent = '';
}

function resetUpload() {
  selectedFiles = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('errorBox').innerHTML = '';
  document.getElementById('batchProgress').style.display = 'none';
  document.getElementById('batchSummary').style.display = 'none';
  sessionStorage.removeItem('lastImageDataUrl');
  sessionStorage.removeItem('batchResults');
  document.getElementById('estimateText').textContent = '';
  updatePreview();
}

// Paginated batch results display
const BATCH_PAGE_SIZE = 6;

function renderBatchSummary(allResults) {
  const token = sessionStorage.getItem('maize_access_token') || '';
  const summary = document.getElementById('batchSummary');
  const stats = document.getElementById('batchStats');
  const grid = document.getElementById('batchGrid');
  const pager = document.getElementById('batchPager');

  summary.style.display = 'block';
  stats.textContent = `${allResults.length} images analyzed. Click any image to view details.`;

  let page = 0;
  const totalPages = Math.ceil(allResults.length / BATCH_PAGE_SIZE);

  function showPage(p) {
    page = p;
    grid.innerHTML = '';
    const start = page * BATCH_PAGE_SIZE;
    const end = Math.min(start + BATCH_PAGE_SIZE, allResults.length);

    for (let i = start; i < end; i++) {
      const item = allResults[i];
      const r = item.result;
      const imgUrl = r.imageId
        ? API_BASE + '/api/images/' + r.imageId + '/file/original?access_token=' + encodeURIComponent(token)
        : '';
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid #ddd;border-radius:8px;overflow:hidden;cursor:pointer;transition:box-shadow 0.2s;';
      card.onmouseenter = function() { card.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)'; };
      card.onmouseleave = function() { card.style.boxShadow = 'none'; };
      card.onclick = function() {
        sessionStorage.setItem('lastResult', JSON.stringify(r));
        location.href = 'result.html';
      };

      card.innerHTML =
        '<div style="aspect-ratio:4/3;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden;">' +
        (imgUrl
          ? '<img src="' + imgUrl + '" alt="' + esc(r.imageName) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\\'<span style=color:#888>No preview</span>\\'">'
          : '<span style="color:#888;">No preview</span>') +
        '</div>' +
        '<div style="padding:0.6rem;">' +
        '<div style="font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(r.imageName) + '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:0.8rem;color:#666;margin-top:0.2rem;">' +
        '<span><strong>' + r.tasselCount + '</strong> tassels</span>' +
        '<span>' + (r.processingTime > 0 ? Number(r.processingTime).toFixed(1) + 's' : '') + '</span>' +
        '<span>' + formatPercent(r.confidenceScore) + '</span>' +
        '</div></div>';

      grid.appendChild(card);
    }

    pager.innerHTML =
      '<button class="btn btn-sm btn-outline" ' + (page === 0 ? 'disabled' : '') + ' onclick="arguments[0].stopPropagation();">Prev</button>' +
      '<span style="font-size:0.9rem;color:#666;">Page ' + (page + 1) + ' / ' + totalPages + '</span>' +
      '<button class="btn btn-sm btn-outline" ' + (page >= totalPages - 1 ? 'disabled' : '') + ' onclick="arguments[0].stopPropagation();">Next</button>';

    // Re-attach events (workaround for innerHTML limits)
    var btns = pager.querySelectorAll('button');
    if (btns[0]) btns[0].onclick = function() { if (page > 0) showPage(page - 1); };
    if (btns[1]) btns[1].onclick = function() { if (page < totalPages - 1) showPage(page + 1); };
  }

  showPage(0);
}
</script>
</body>
</html>
