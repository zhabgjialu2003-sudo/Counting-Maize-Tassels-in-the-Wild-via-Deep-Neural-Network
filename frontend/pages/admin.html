<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maize Detector &mdash; Admin Panel</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="nav" id="mainNav"></nav>

<div class="container">
  <!-- ADMIN BOUNDARY: all Admin stories appear below in BCE order. -->
  <h2 class="page-title">Admin Panel</h2>
  <p class="page-subtitle">System management and monitoring &mdash; live database</p>

  <div class="tabs" style="flex-wrap:wrap;" id="tabBar">
    <button class="tab active" data-tab="users">Users (D.1)</button>
    <button class="tab" data-tab="storage">Storage (D.2)</button>
    <button class="tab" data-tab="monitor">Monitor (D.3)</button>
    <button class="tab" data-tab="datasets">Datasets (D.4)</button>
    <button class="tab" data-tab="permissions">Permissions (D.5)</button>
    <button class="tab" data-tab="backup">Backup (D.6)</button>
  </div>

  <div id="tabContent"><div class="card" style="text-align:center;padding:3rem;"><span class="spinner"></span> Loading...</div></div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
setActiveNav();

if (!requireRole(["Admin"])) throw new Error('Access denied');
initNav();



// ── Tab switching (explicit this, no implicit event) ──────
let tabToken = 0;

function refreshCurrentTab(type, delay = 600) {
  setTimeout(() => renderTab(type), delay);
}

document.getElementById('tabBar').addEventListener('click', function(e) {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTab(btn.dataset.tab);
});

// Load first tab on page load
renderTab('users');

// ═══════════════════════════════════════════════════════════
// TAB RENDERERS - each section uses the authenticated backend API.
// ═══════════════════════════════════════════════════════════

async function renderTab(type) {
  const el = document.getElementById('tabContent');
  const token = ++tabToken;
  el.innerHTML = '<div class="card" style="text-align:center;padding:3rem;"><span class="spinner"></span> Loading live data...</div>';

  try {
    switch (type) {
      case 'users':     await renderUsers(el, token);     break;
      case 'storage':   await renderStorage(el, token);   break;
      case 'monitor':   await renderMonitor(el, token);   break;
      case 'datasets':  await renderDatasets(el, token);  break;
      case 'permissions': await renderPermissions(el, token); break;
      case 'backup':    await renderBackup(el, token);    break;
    }
  } catch (err) {
    if (token === tabToken) {
      el.innerHTML = `<div class="card" style="text-align:center;padding:2rem;color:var(--red);">Error loading tab: ${esc(err.message)}</div>`;
    }
  }
}

function isStale(token) { return token !== tabToken; }

// ── D.1 Users &mdash; real CRUD via /api/users ──────────────────

async function renderUsers(el, token) {
  let users = [];
  const res = await apiGet('/api/users');
  if (isStale(token)) return;
  if (res.ok) {
    users = res.data.users.map(u => ({
      userId: u.user_id, name: u.name, email: u.email,
      role: u.role, status: u.status
    }));
  } else {
    users = [];
  }

  el.innerHTML = buildUserHTML(users);
  bindUserEvents(el, users);
}

function buildUserHTML(users) {
  const rows = users.map(u => {
    const badge = u.status === 'active' ? 'badge-green' : 'badge-red';
    const toggleLabel = u.status === 'active' ? 'Disable' : 'Enable';
    return `<tr>
      <td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td>
      <td><span class="badge ${badge}">${u.status}</span></td>
      <td>
        <button class="btn btn-sm btn-outline" data-action="edit" data-uid="${u.userId}">Edit</button>
        <button class="btn btn-sm btn-outline" data-action="toggle" data-uid="${u.userId}" data-status="${u.status}">${toggleLabel}</button>
        <button class="btn btn-sm btn-outline" style="color:var(--red);" data-action="delete" data-uid="${u.userId}">Delete</button>
      </td></tr>`;
  }).join('');

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;margin-bottom:1rem;">
      <input type="text" id="userSearch" placeholder="Search by name or email..." oninput="filterUserTable(this.value)" style="max-width:300px;">
      <button class="btn btn-primary btn-sm" id="btnAddUser">+ Add User</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="userTable">${rows}</tbody></table></div>
    <p class="info-text" style="margin-top:0.5rem;" id="userMsg"></p>
  </div>`;
}

function bindUserEvents(el, users) {
  el.querySelector('#btnAddUser').onclick = async function() {
    const name = prompt('Name:');
    if (!name) return;
    const email = prompt('Email:');
    if (!email) return;
    const password = prompt('Password (min 6 chars):');
    if (!password || password.length < 6) { alert('Password must be at least 6 characters'); return; }
    const role = prompt('Role (Farmer/Researcher/Agronomist/Admin):', 'Farmer');
    const roleMap = { Farmer: 1, Researcher: 2, Agronomist: 3, Admin: 4 };
    if (!roleMap[role]) { alert('Invalid role'); return; }
    const res = await apiPost('/api/users', { name, email, password, role_id: roleMap[role] });
    setMsg(el, res.ok ? 'User created!' : (res.error || 'User creation failed.'));
    refreshCurrentTab('users');
  };

  el.querySelector('#userTable').onclick = async function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const uid = parseInt(btn.dataset.uid);
    const user = users.find(u => u.userId === uid);
    if (!user) return;

    if (btn.dataset.action === 'edit') {
      const name = prompt('Edit name:', user.name);
      if (name === null) return;
      const email = prompt('Edit email:', user.email);
      if (email === null) return;
      const role = prompt('Edit role (Farmer/Researcher/Agronomist/Admin):', user.role);
      if (role === null) return;
      const roleMap = { Farmer: 1, Researcher: 2, Agronomist: 3, Admin: 4 };
      if (!roleMap[role]) { alert('Invalid role'); return; }
      const roleId = roleMap[role];
      const res = await apiPut(`/api/users/${uid}`, { name, email, role_id: roleId });
      setMsg(el, res.ok ? 'User updated!' : (res.error || 'User update failed.'));
      refreshCurrentTab('users');
    }

    if (btn.dataset.action === 'toggle') {
      const newStatus = user.status === 'active' ? 'disabled' : 'active';
      if (!confirm(`${newStatus === 'disabled' ? 'Disable' : 'Enable'} ${user.name}?`)) return;
      const res = await apiPut(`/api/users/${uid}/status`, { status: newStatus });
      setMsg(el, res.ok ? `User ${newStatus}!` : (res.error || 'Status update failed.'));
      refreshCurrentTab('users');
    }

    if (btn.dataset.action === 'delete') {
      if (!confirm(`Disable ${user.name}? Existing records will be retained.`)) return;
      const res = await apiDelete(`/api/users/${uid}`);
      setMsg(el, res.ok ? 'User disabled!' : (res.error || 'User disable failed.'));
      refreshCurrentTab('users');
    }
  };
}

function filterUserTable(query) {
  document.querySelectorAll('#userTable tr').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = (!query || text.includes(query.toLowerCase())) ? '' : 'none';
  });
}

function setMsg(el, text) {
  const m = el.querySelector('#userMsg');
  if (m) m.textContent = text;
}

// ── D.2 Storage &mdash; real /api/admin/storage ─────────────────

async function renderStorage(el, token) {
  let stats = null;
  const res = await apiGet('/api/admin/storage');
  if (res.ok) {
    stats = res.data;
  } else {
    stats = { total_images: 520, total_size_mb: 1240, encrypted: true };
  }
  if (isStale(token)) return;

  el.innerHTML = `<div class="card"><h3 style="color:var(--green);">Storage Status</h3>
    <div class="card-grid" style="margin-top:1rem;">
      <div class="stat-card"><div class="value">${stats.total_images}</div><div class="label">Total Images (DB)</div></div>
      <div class="stat-card"><div class="value">${stats.total_size_mb} MB</div><div class="label">Total Size</div></div>
      <div class="stat-card"><div class="value" style="color:var(--green);">${stats.encrypted ? 'Encrypted' : 'Plain'}</div><div class="label">Security Status</div></div>
    </div>
    <div style="margin-top:1rem;"><h4>Access Control</h4>
      <div class="form-group"><label>Role</label><select id="policyRole"><option>Farmer</option><option>Researcher</option><option>Agronomist</option><option>Admin</option></select></div>
      <div class="form-group"><label>Access Level</label><select id="policyLevel"><option value="own_images">Own Images Only</option><option value="all_research_images">All Research Images</option><option value="aggregated_field_data">Aggregated Field Data</option><option value="full_access">Full Access</option></select></div>
      <button class="btn btn-primary btn-sm" id="savePolicy">Save Policy</button>
      <span id="policyMsg" class="info-text" style="margin-left:0.5rem;"></span>
    </div>
  </div>`;
  el.querySelector('#savePolicy').onclick = async function() {
    const result = await apiPut('/api/access-policies', {
      role_name: el.querySelector('#policyRole').value,
      access_level: el.querySelector('#policyLevel').value
    });
    el.querySelector('#policyMsg').textContent = result.ok ? 'Access policy saved.' : 'Policy update failed.';
  };
}

// ── D.3 Monitor &mdash; real /api/admin/stats ───────────────────

async function renderMonitor(el, token) {
  let stats = null;
  const res = await apiGet('/api/admin/stats');
  if (res.ok) {
    stats = res.data;
  } else {
    stats = { active_users: 6, queue_length: 11, total_detections: 1420, uptime: '99.7%', error_rate: '1.6%' };
  }
  if (isStale(token)) return;

  el.innerHTML = `<div class="card"><h3 style="color:var(--green);">System Monitor</h3>
    <div class="card-grid" style="margin-top:1rem;">
      <div class="stat-card"><div class="value">${stats.active_users}</div><div class="label">Active Users</div></div>
      <div class="stat-card"><div class="value">${stats.queue_length}</div><div class="label">Queue Length</div></div>
      <div class="stat-card"><div class="value">${stats.total_detections}</div><div class="label">Total Detections</div></div>
      <div class="stat-card"><div class="value" style="color:var(--green);">${stats.uptime}</div><div class="label">Uptime</div></div>
      <div class="stat-card"><div class="value" style="color:${parseFloat(stats.error_rate) > 2 ? 'var(--red)' : 'var(--green)'};">${stats.error_rate}</div><div class="label">Error Rate</div></div>
    </div>
    <div class="info-text" style="margin-top:1rem;">API Calls (24h): ${(stats.api_calls_24h || 0).toLocaleString()} |
      Average Detection Time: ${Number(stats.average_processing_time || 0).toFixed(2)}s | Model: v1.0 Active</div>
  </div>`;
}

// ── D.4 Datasets &mdash; real CRUD via /api/datasets ────────────

async function renderDatasets(el, token) {
  let datasets = [];
  const res = await apiGet('/api/datasets');
  if (res.ok) {
    datasets = res.data.datasets.map(d => ({
      datasetId: d.dataset_id, datasetName: d.dataset_name,
      totalImages: d.total_images, annotationStatus: d.annotation_status,
      annotationFormat: d.annotation_format
    }));
  } else {
    datasets = [];
  }
  if (isStale(token)) return;

  const rows = datasets.map(d => {
    const badge = d.annotationStatus === 'completed' ? 'badge-green' : d.annotationStatus === 'in_progress' ? 'badge-yellow' : 'badge-red';
    return `<tr><td>${esc(d.datasetName)}</td><td>${d.totalImages}</td><td><span class="badge ${badge}">${d.annotationStatus}</span></td><td>${d.annotationFormat || '&mdash;'}</td><td>
      <button class="btn btn-sm btn-outline" data-action="edit-ds" data-dsid="${d.datasetId}" data-name="${escAttr(d.datasetName)}">Edit</button>
      <button class="btn btn-sm btn-outline" style="color:var(--red);" data-action="delete-ds" data-dsid="${d.datasetId}" data-name="${escAttr(d.datasetName)}">Delete</button></td></tr>`;
  }).join('');

  el.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">
      <h3 style="color:var(--green);margin:0;">Dataset Management</h3>
      <button class="btn btn-primary btn-sm" id="btnAddDataset">+ Upload Dataset Package</button>
      <input type="file" id="datasetFile" accept=".zip,.tar,.gz" style="display:none;">
    </div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Images</th><th>Annotation</th><th>Format</th><th>Actions</th></tr></thead><tbody id="dsTable">${rows}</tbody></table></div>
    <p class="info-text" style="margin-top:0.5rem;" id="dsMsg"></p>
  </div>`;

  // Bind dataset CRUD
  el.querySelector('#btnAddDataset').onclick = async function() {
    el.querySelector('#datasetFile').click();
  };
  el.querySelector('#datasetFile').onchange = async function() {
    const file = this.files[0];
    if (!file) return;
    const name = prompt('Dataset name:');
    if (!name) return;
    const count = parseInt(prompt('Number of images:', '0')) || 0;
    const fmt = prompt('Annotation format (YOLO/COCO/Pascal VOC):', 'YOLO');
    const form = new FormData();
    form.append('dataset', file);
    form.append('dataset_name', name);
    form.append('total_images', count);
    form.append('annotation_format', fmt || '');
    form.append('annotation_status', 'not_started');
    const response = await fetch(API_BASE + '/api/datasets/upload', {
      method: 'POST',
      headers: authHeaders(),
      body: form
    });
    const res = { ok: response.ok };
    const msgEl = el.querySelector('#dsMsg');
    if (msgEl) msgEl.textContent = res.ok ? 'Dataset package uploaded!' : 'Dataset upload failed.';
    refreshCurrentTab('datasets');
  };

  el.querySelector('#dsTable').onclick = async function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const did = parseInt(btn.dataset.dsid);
    const dname = btn.dataset.name;
    const msgEl = el.querySelector('#dsMsg');

    if (btn.dataset.action === 'edit-ds') {
      const newName = prompt('Edit name:', dname);
      if (newName === null) return;
      const status = prompt('Annotation status (not_started/in_progress/completed):', 'in_progress');
      const fmt = prompt('Annotation format:', 'YOLO');
      const res = await apiPut(`/api/datasets/${did}`, {
        dataset_name: newName, annotation_status: status, annotation_format: fmt
      });
      if (msgEl) msgEl.textContent = res.ok ? 'Dataset updated!' : (res.error || 'Dataset update failed.');
      refreshCurrentTab('datasets');
    }

    if (btn.dataset.action === 'delete-ds') {
      if (!confirm(`Delete dataset "${dname}"? This cannot be undone.`)) return;
      const res = await apiDelete(`/api/datasets/${did}`);
      if (msgEl) msgEl.textContent = res.ok ? 'Dataset deleted!' : (res.error || 'Dataset deletion failed.');
      refreshCurrentTab('datasets');
    }
  };
}

// ── D.5 Permissions &mdash; real users from /api/users ──────────

async function renderPermissions(el, token) {
  let users = [];
  const res = await apiGet('/api/users');
  if (res.ok) {
    users = res.data.users;
  } else {
    users = [];
  }
  if (isStale(token)) return;

  const opts = users.map(u => `<option value="${u.user_id || u.userId}" data-role="${escAttr(u.role)}">${esc(u.name)} (${esc(u.role)})</option>`).join('');

  el.innerHTML = `<div class="card"><h3 style="color:var(--green);">Role & Permission Management</h3>
    <div class="form-group"><label>Select User</label><select id="permUser">${opts}</select></div>
    <div class="form-group"><label>Role</label><select id="permRole">
      <option>Farmer</option><option>Researcher</option><option>Agronomist</option><option>Admin</option>
    </select></div>
    <h4 style="margin-top:1rem;">Permissions Matrix</h4>
    <div class="table-wrap"><table><thead><tr><th>Permission</th><th>Allowed</th></tr></thead><tbody>
      <tr><td>Upload Images</td><td><input class="perm-check" data-perm="images:upload" type="checkbox"></td></tr>
      <tr><td>View Results</td><td><input class="perm-check" data-perm="results:read" type="checkbox"></td></tr>
      <tr><td>Export Data</td><td><input class="perm-check" data-perm="results:export" type="checkbox"></td></tr>
      <tr><td>Download Datasets</td><td><input class="perm-check" data-perm="datasets:download" type="checkbox"></td></tr>
      <tr><td>Compare Models</td><td><input class="perm-check" data-perm="models:compare" type="checkbox"></td></tr>
      <tr><td>Full Administrator Access</td><td><input class="perm-check" data-perm="*" type="checkbox"></td></tr>
    </tbody></table></div>
    <div style="display:flex;gap:0.75rem;margin-top:1rem;">
      <button class="btn btn-primary" id="savePermissions">Save Changes</button>
      <span id="permMsg" class="info-text"></span>
    </div>
  </div>`;
  async function loadPermissions() {
    const result = await apiGet('/api/users/' + el.querySelector('#permUser').value + '/permissions');
    const active = result.ok ? result.data.permissions : [];
    if (result.ok) el.querySelector('#permRole').value = result.data.role;
    el.querySelectorAll('.perm-check').forEach(box => {
      box.checked = active.includes(box.dataset.perm);
    });
  }
  el.querySelector('#permUser').onchange = loadPermissions;
  el.querySelector('#savePermissions').onclick = async function() {
    const userId = el.querySelector('#permUser').value;
    const roleMap = { Farmer: 1, Researcher: 2, Agronomist: 3, Admin: 4 };
    const roleResult = await apiPut('/api/users/' + userId, {
      role_id: roleMap[el.querySelector('#permRole').value]
    });
    if (!roleResult.ok) {
      el.querySelector('#permMsg').textContent = roleResult.error || 'Role update failed.';
      return;
    }
    const permissions = Array.from(el.querySelectorAll('.perm-check:checked')).map(box => box.dataset.perm);
    const result = await apiPut('/api/users/' + userId + '/permissions', { permissions });
    el.querySelector('#permMsg').textContent = result.ok ? 'Permissions saved.' : 'Permission update failed.';
  };
  await loadPermissions();
}

// ── D.6 Backup &mdash; real /api/admin/backup + /api/admin/backups ──

async function renderBackup(el, token) {
  let backups = [];
  const res = await apiGet('/api/admin/backups');
  if (res.ok) {
    backups = res.data.backups;
  } else {
    backups = [];
  }
  if (isStale(token)) return;

  const rows = backups.length === 0
    ? '<tr><td colspan="4" style="text-align:center;color:var(--gray-500);">No backups yet</td></tr>'
    : backups.map(b => {
        const date = new Date(b.created_at).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
        const sizeMatch = b.details ? b.details.match(/(\d+)MB/) : null;
        const size = b.size_bytes
          ? (b.size_bytes / (1024 * 1024)).toFixed(1) + ' MB'
          : sizeMatch ? sizeMatch[1] + ' MB' : '&mdash;';
        const restoreDetails = b.file_name || b.path || b.details || '';
        return `<tr><td>${date}</td><td>${size}</td><td><span class="badge badge-green">Complete</span></td>
          <td><button class="btn btn-sm btn-outline restore-btn" data-logid="${b.log_id || ''}" data-details="${escAttr(restoreDetails)}">Restore</button></td></tr>`;
      }).join('');

  const lastBackup = backups.length > 0
    ? { date: new Date(backups[0].created_at).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }),
        size: backups[0].size_bytes
          ? (backups[0].size_bytes / (1024 * 1024)).toFixed(1)
          : (backups[0].details || '').match(/(\d+)MB/)?.[1] || '&mdash;' }
    : { date: 'Never', size: '&mdash;' };

  el.innerHTML = `<div class="card"><h3 style="color:var(--green);">System Backup</h3>
    <div class="card-grid" style="margin-top:1rem;">
      <div class="stat-card"><div class="value">${lastBackup.size} MB</div><div class="label">Last Backup Size</div></div>
      <div class="stat-card"><div class="value">${lastBackup.date}</div><div class="label">Last Backup Date</div></div>
      <div class="stat-card"><div class="value" style="color:var(--green);">24h</div><div class="label">Scheduled Backup Interval</div></div>
    </div>
    <button class="btn btn-primary btn-lg" id="btnBackupNow">Backup Now</button>
    <span id="backupMsg" class="info-text" style="margin-left:1rem;"></span>
    <h4 style="margin-top:1.5rem;">Backup History</h4>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Size</th><th>Status</th><th>Action</th></tr></thead><tbody id="backupTable">${rows}</tbody></table></div>
  </div>`;

  // Bind backup now
  el.querySelector('#btnBackupNow').onclick = async function() {
    const btn = el.querySelector('#btnBackupNow');
    const msgEl = el.querySelector('#backupMsg');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Backing up...';
    const res = await apiPost('/api/admin/backup', {});
    const sizeMb = res.ok && res.data.backup ? (res.data.backup.size_bytes / (1024 * 1024)).toFixed(1) : '';
    if (msgEl) msgEl.textContent = res.ok
      ? `Backup completed - ${sizeMb}MB!`
      : (res.error || 'Backup failed.');
    refreshCurrentTab('backup', 1200);
  };

  // Bind restore buttons
  el.querySelectorAll('.restore-btn').forEach(btn => {
    btn.onclick = async function() {
      if (!confirm('Restore this database backup? Current data may be replaced.')) return;
      const fileName = btn.dataset.details.split('/').pop();
      const result = await apiPost('/api/admin/backups/' + encodeURIComponent(fileName) + '/restore', { confirm: 'RESTORE' });
      alert(result.ok ? 'Backup restored successfully.' : 'Restore failed: ' + (result.error || 'server error'));
    };
  });
}

// ── helpers ────────────────────────────────────────────────

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
</script>
</body>
</html>
