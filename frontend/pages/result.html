<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Maize Detector - Detection Result</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/maize-icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/mobile.css">
</head>
<body>

<div id="networkStatus" class="network-status" role="status" hidden></div>
<nav class="nav" id="mainNav"></nav>

<div class="container">
  <!-- USER STORY A.3 Boundary: show a clear count, confidence, and processing time. -->
  <a href="mobile.html" class="mobile-only" id="resultBack" style="color:var(--mobile-green);font-weight:750;text-decoration:none">‹ 返回首页</a>
  <h2 class="page-title" id="resultTitle">Detection Result</h2>
  <p class="page-subtitle" id="imageNameLabel">Image: -</p>
  <div id="sourceNotice" class="alert" style="margin-bottom:1rem;"></div>

  <div class="card" style="text-align:center;">
    <div style="font-size:4rem;font-weight:800;color:var(--green);" id="countDisplay">-</div>
    <div style="font-size:1rem;color:#3f5144;" id="countLabel">Detected Tassels</div>
  </div>

  <div class="card-grid" style="margin-top:1rem;">
    <div class="stat-card">
      <div class="value" id="confidenceDisplay">-</div>
      <div class="label" id="confidenceLabel">Confidence Score</div>
    </div>
    <div class="stat-card">
      <div class="value" id="timeDisplay">-</div>
      <div class="label" id="timeLabel">Processing Time (seconds)</div>
    </div>
  </div>

  <div class="card" id="provenanceCard" style="margin-top:1rem;">
    <h3 style="color:var(--green);margin-bottom:0.75rem;">Result provenance</h3>
    <p style="margin:0;"><strong>Model:</strong> <span id="modelVersionDisplay">Not recorded</span></p>
    <p style="margin:0.35rem 0 0;"><strong>Inference mode:</strong> <span id="inferenceModeDisplay">Not recorded</span></p>
    <p style="margin:0.35rem 0 0;"><strong>Review status:</strong> <span id="qualityStatusDisplay">Unreviewed</span></p>
  </div>

  <!-- USER STORY A.4 Boundary: display highlighted tassels and compare images. -->
  <div class="card" style="margin-top:1rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="color:var(--green);" id="imageViewTitle">Image View</h3>
      <label class="toggle" onclick="toggleCompare()">
        <input type="checkbox" id="compareToggle"> <span id="compareLabel">Compare Original vs Annotated</span>
      </label>
    </div>
    <div id="imageContainer" class="compare" style="display:grid;grid-template-columns:1fr;gap:1rem;">
      <div>
        <p id="annotatedLabel" style="text-align:center;font-weight:600;margin-bottom:0.5rem;">Annotated Image (with bounding boxes)</p>
        <div style="position:relative;border-radius:6px;border:1px solid var(--gray-300);overflow:hidden;background:#f8faf8;">
          <img id="annotatedImg" src="" alt="Annotated maize field" style="display:block;width:100%;min-height:200px;">
          <svg id="annotationOverlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></svg>
        </div>
      </div>
      <div id="originalPanel" style="display:none;">
        <p style="text-align:center;font-weight:600;margin-bottom:0.5rem;">Original Image</p>
        <img id="originalImg" src="" alt="Original maize field" style="width:100%;border-radius:6px;border:1px solid var(--gray-300);min-height:200px;">
      </div>
    </div>
  </div>

  <div id="resultActions" style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;"></div>
</div>

<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <a href="mobile.html"><span aria-hidden="true">⌂</span><b id="navHome">首页</b></a>
  <a href="history.html"><span aria-hidden="true">◷</span><b id="navHistory">历史</b></a>
  <a href="profile.html"><span aria-hidden="true">○</span><b id="navMine">我的</b></a>
</nav>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/mobile.js"></script>
<script src="../js/pwa.js"></script>
<script>
setActiveNav();

if (!requireRole(["Farmer", "Researcher"])) throw new Error('Access denied');
initNav();



let resultData = null;
const stored = sessionStorage.getItem('lastResult');
const uploadedImageDataUrl = sessionStorage.getItem('lastImageDataUrl');
const params = new URLSearchParams(location.search);
const requestedResultId = params.get('id');

function rememberResult(result) {
  if (!result) return;
  try {
    sessionStorage.setItem('lastResult', JSON.stringify(result));
  } catch (error) {
    console.warn('The latest result could not be cached in this browser.', error);
  }
}

function keepResultIdInAddress(result) {
  if (!result || !result.resultId || requestedResultId) return;
  const url = new URL(location.href);
  url.searchParams.set('id', result.resultId);
  history.replaceState(null, '', url);
}

// USER STORY A.3 Control call: retrieve one persisted detection result.
async function loadResult() {
  document.getElementById('countDisplay').textContent = '...';
  document.getElementById('confidenceDisplay').textContent = '--';
  document.getElementById('timeDisplay').textContent = 'Calculating...';

  let storedResult = null;
  if (stored) {
    try { storedResult = normalizeResult(JSON.parse(stored)); } catch (error) { storedResult = null; }
  }

  const effectiveResultId = requestedResultId || (storedResult && storedResult.resultId);
  if (effectiveResultId !== null && effectiveResultId !== undefined && effectiveResultId !== '') {
    const response = await apiGet(`/api/results/${encodeURIComponent(effectiveResultId)}`);
    if (response.ok) {
      resultData = normalizeResult(response.data);
    } else if (storedResult && String(storedResult.resultId) === String(effectiveResultId)) {
      resultData = storedResult;
    }
  } else {
    const historyResponse = await apiGet('/api/history?limit=1');
    const records = historyResponse.ok && Array.isArray(historyResponse.data.records)
      ? historyResponse.data.records
      : [];
    if (records.length) resultData = normalizeResult(records[0]);
  }

  if (resultData) {
    rememberResult(resultData);
    keepResultIdInAddress(resultData);
  }

  if (!resultData) {
    document.getElementById('sourceNotice').className = 'alert alert-error';
    document.getElementById('sourceNotice').textContent =
      'No saved tassel result is available. Upload a maize-field photo to create one.';
    document.getElementById('countDisplay').textContent = '--';
    document.getElementById('timeDisplay').textContent = '--';
    return;
  }
  await displayResult(resultData);
  renderResultActions();
}

async function displayResult(data) {
  const sourceNotice = document.getElementById('sourceNotice');
  sourceNotice.className = 'alert alert-success';
  const mobileZh = window.matchMedia('(max-width: 768px)').matches && mobileLanguage() === 'zh-CN';
  sourceNotice.innerHTML = mobileZh
    ? '<strong>真实结果：</strong>由 PostgreSQL 和已部署的玉米穗模型返回。'
    : '<strong>Real result:</strong> loaded from PostgreSQL and the deployed tassel model.';
  document.getElementById('imageNameLabel').textContent =
    (mobileZh ? '图片：' : 'Image: ') + data.imageName;
  document.getElementById('countDisplay').textContent = data.tasselCount;
  document.getElementById('confidenceDisplay').textContent = formatPercent(data.confidenceScore);
  document.getElementById('timeDisplay').textContent =
    data.processingTime > 0 ? Number(data.processingTime).toFixed(1) + 's' : '< 0.1s';
  document.getElementById('modelVersionDisplay').textContent = data.modelVersion || 'Not recorded';
  document.getElementById('inferenceModeDisplay').textContent = data.inferenceMode || 'Not recorded';
  document.getElementById('qualityStatusDisplay').textContent = data.qualityStatus || 'Unreviewed';

  var imageId = data.imageId;
  var protectedPath = data.originalAssetUrl || (imageId ? '/api/images/' + imageId + '/file/original' : null);
  var filePath = (!requestedResultId && uploadedImageDataUrl) || protectedPath;
  var imgUrl = null;
  try {
    imgUrl = protectedPath
      ? await fetchProtectedAssetUrl(protectedPath)
      : (filePath && filePath.startsWith('data:') ? filePath : await fetchProtectedAssetUrl(filePath));
  } catch (error) {
    console.error('Could not load protected result image', error);
  }
  var fallbackMsg = 'Maize Field Image - ' + data.tasselCount + ' Tassels Detected';

  // Reset state
  var annImg = document.getElementById('annotatedImg');
  var oriImg = document.getElementById('originalImg');
  var overlay = document.getElementById('annotationOverlay');
  annImg.style.display = 'block';
  oriImg.style.display = 'block';
  overlay.innerHTML = '';

  if (imgUrl) {
    // Show fallback in overlay while image loads
    overlay.innerHTML =
      '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
      '<text x="50%" y="50%" text-anchor="middle" fill="#888" font-size="14" font-family="sans-serif">Loading image...</text>';

    annImg.onload = function() {
      overlay.innerHTML = '';
      if (data.bboxData) renderAnnotationOverlay(data, true);
      console.log('Image loaded: ' + imgUrl.substring(0,80));
    };
    annImg.onerror = function() {
      annImg.onerror = null;
      annImg.style.display = 'none';
      overlay.innerHTML =
        '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
        '<text x="50%" y="45%" text-anchor="middle" fill="#558b2f" font-size="18" font-family="sans-serif">' + esc(fallbackMsg) + '</text>' +
        '<text x="50%" y="58%" text-anchor="middle" fill="#888" font-size="13" font-family="sans-serif">[ Image data not available in database ]</text>';
      console.warn('Image failed: ' + imgUrl.substring(0,80));
    };
    annImg.src = imgUrl;
    oriImg.src = imgUrl;
  } else {
    // No image URL at all
    annImg.style.display = 'none';
    oriImg.style.display = 'none';
    overlay.innerHTML =
      '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
      '<text x="50%" y="45%" text-anchor="middle" fill="#558b2f" font-size="18" font-family="sans-serif">' + esc(fallbackMsg) + '</text>' +
      '<text x="50%" y="58%" text-anchor="middle" fill="#888" font-size="13" font-family="sans-serif">[ Result data unavailable ]</text>';
  }

  // Always show both images (compare mode shows side-by-side)
  document.getElementById('originalPanel').style.display = 'none';
  document.getElementById('imageContainer').style.gridTemplateColumns = '1fr';
  document.getElementById('compareToggle').checked = false;
}

// USER STORY A.4 Boundary rendering: draw model bbox_data over the image.
function renderAnnotationOverlay(data, hasRealImage) {
  const overlay = document.getElementById('annotationOverlay');
  const bbox = data.bboxData;
  if (!hasRealImage || !bbox) {
    overlay.innerHTML = '';
    return;
  }

  const width = bbox.image_width || bbox.imageWidth || 600;
  const height = bbox.image_height || bbox.imageHeight || 400;
  overlay.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const boxes = Array.isArray(bbox.boxes) ? bbox.boxes : [];
  const points = Array.isArray(bbox.points) ? bbox.points : [];
  const boxMarkup = boxes.slice(0, 250).map(box => {
    const x = box.x ?? box.xmin ?? 0;
    const y = box.y ?? box.ymin ?? 0;
    const w = box.width ?? ((box.xmax ?? x) - x) ?? 20;
    const h = box.height ?? ((box.ymax ?? y) - y) ?? 20;
    var conf = box.confidence || box.conf || 0.9;
    var opacity = 0.35 + conf * 0.55;  // 0.80~0.90 based on confidence
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" fill="rgba(220,38,38,0.12)" stroke="#dc2626" stroke-width="2" rx="2" opacity="' + opacity.toFixed(2) + '"/>';
  }).join('');
  const pointMarkup = points.slice(0, 300).map(point => {
    const x = point.x ?? point.cx ?? 0;
    const y = point.y ?? point.cy ?? 0;
    return '<circle cx="' + x + '" cy="' + y + '" r="6" fill="rgba(220,38,38,0.15)" stroke="#dc2626" stroke-width="2"/>';
  }).join('');

  overlay.innerHTML = boxMarkup + pointMarkup;
}

function toggleCompare() {
  const checked = document.getElementById('compareToggle').checked;
  document.getElementById('imageContainer').style.gridTemplateColumns = checked ? '1fr 1fr' : '1fr';
  document.getElementById('originalPanel').style.display = checked ? 'block' : 'none';
}

function saveResult() {
  alert(mobileLanguage() === 'zh-CN' ? '结果已经保存到历史记录。' : 'Result saved to history!');
  location.href = currentRole() === 'Researcher'
    ? 'history.html'
    : (window.matchMedia('(max-width: 768px)').matches ? 'mobile.html' : 'dashboard.html');
}

// USER STORY B.1 Boundary: Researchers can flag a result for review.
function renderResultActions() {
  const role = currentRole();
  const el = document.getElementById('resultActions');
  if (role === 'Researcher') {
    el.innerHTML =
      '<a href="history.html" class="btn btn-primary">View History</a>' +
      '<a href="export.html" class="btn btn-outline">Export Result</a>' +
      '<button class="btn btn-outline" onclick="flagResult()">Flag for Review</button>' +
      '<a href="researcher.html" class="btn btn-outline">Researcher Dashboard</a>';
    return;
  }
  el.innerHTML =
    '<button class="btn btn-primary" onclick="saveResult()">' + (mobileLanguage() === 'zh-CN' ? '保存并返回首页' : 'Save and return home') + '</button>' +
    '<a href="upload.html" class="btn btn-outline">' + (mobileLanguage() === 'zh-CN' ? '再拍一张' : 'Take another photo') + '</a>' +
    '<a href="' + (window.matchMedia('(max-width: 768px)').matches ? 'mobile.html' : 'dashboard.html') + '" class="btn btn-outline">' +
      (mobileLanguage() === 'zh-CN' ? '返回首页' : 'Farmer home') + '</a>';
}

// USER STORY B.1 Control call: persist the quality review note.
async function flagResult() {
  const note = prompt('Why should this result be reviewed?');
  if (!note || !resultData.resultId) return;
  const response = await apiPost('/api/results/' + resultData.resultId + '/flag', { note });
  alert(response.ok ? 'Result flagged for review.' : 'Could not flag this result.');
}

function renderResultLanguage() {
  if (!window.matchMedia('(max-width: 768px)').matches) return;
  const zh = mobileLanguage() === 'zh-CN';
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  document.getElementById('resultBack').textContent = zh ? '‹ 返回首页' : '‹ Back home';
  document.getElementById('resultTitle').textContent = zh ? '玉米穗计数结果' : 'Tassel counting result';
  document.getElementById('countLabel').textContent = zh ? '检测到的玉米穗' : 'Detected tassels';
  document.getElementById('confidenceLabel').textContent = zh ? '模型置信度' : 'Confidence score';
  document.getElementById('timeLabel').textContent = zh ? '处理时间（秒）' : 'Processing time (seconds)';
  document.getElementById('imageViewTitle').textContent = zh ? '标注图片' : 'Image view';
  document.getElementById('compareLabel').textContent = zh ? '对比原图与标注图' : 'Compare original and annotated';
  document.getElementById('annotatedLabel').textContent = zh ? '已标出检测框的图片' : 'Annotated image (with bounding boxes)';
  document.getElementById('navHome').textContent = zh ? '首页' : 'Home';
  document.getElementById('navHistory').textContent = zh ? '历史' : 'History';
  document.getElementById('navMine').textContent = zh ? '我的' : 'My account';
}
renderResultLanguage();
loadResult();
</script>
</body>
</html>
