<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maize Detector - Detection Result</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="dashboard.html">Maize Detector</a>
  <div class="nav-links">
    <a href="dashboard.html">Home</a>
    <a href="upload.html">Upload</a>
    <a href="history.html">History</a>
    <a href="report.html">Report</a>
    <a href="export.html">Export</a>
    <a href="agronomist.html">Agronomist</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <h2 class="page-title">Detection Result</h2>
  <p class="page-subtitle" id="imageNameLabel">Image: -</p>

  <div class="card" style="text-align:center;">
    <div style="font-size:4rem;font-weight:800;color:var(--green);" id="countDisplay">-</div>
    <div style="font-size:1rem;color:var(--gray-500);">Detected Tassels</div>
  </div>

  <div class="card-grid" style="margin-top:1rem;">
    <div class="stat-card">
      <div class="value" id="confidenceDisplay">-</div>
      <div class="label">Confidence Score</div>
    </div>
    <div class="stat-card">
      <div class="value" id="timeDisplay">-</div>
      <div class="label">Processing Time (seconds)</div>
    </div>
  </div>

  <div class="card" style="margin-top:1rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="color:var(--green);">Image View</h3>
      <label class="toggle" onclick="toggleCompare()">
        <input type="checkbox" id="compareToggle"> Compare Original vs Annotated
      </label>
    </div>
    <div id="imageContainer" class="compare" style="display:grid;grid-template-columns:1fr;gap:1rem;">
      <div>
        <p style="text-align:center;font-weight:600;margin-bottom:0.5rem;">Annotated Image (with bounding boxes)</p>
        <div style="position:relative;border-radius:6px;border:1px solid var(--gray-300);overflow:hidden;background:#f8faf8;">
          <img id="annotatedImg" src="" alt="Annotated maize field" style="display:block;width:100%;min-height:200px;">
          <svg id="annotationOverlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></svg>
        </div>
      </div>
      <div id="originalPanel" style="display:none;">
        <p style="text-align:center;font-weight:600;margin-bottom:0.5rem;">Original Image</p>
        <img id="originalImg" src="" alt="Original maize field" style="width:100%;border-radius:6px;border:1px solid var(--gray-300);min-height:200px;">
      </div>
    </div>
  </div>

  <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;">
    <button class="btn btn-primary" onclick="saveResult()">Save Result</button>
    <a href="export.html" class="btn btn-outline">Export Result</a>
    <a href="upload.html" class="btn btn-outline">Upload Another</a>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
setActiveNav();

let resultData = null;
const stored = sessionStorage.getItem('lastResult');
const params = new URLSearchParams(location.search);
const resultId = params.get('id');

async function loadResult() {
  if (stored) {
    try { resultData = normalizeResult(JSON.parse(stored)); } catch (e) { resultData = null; }
  }

  if (resultId && (!resultData || String(resultData.resultId) !== resultId || !resultData.imagePath)) {
    const response = await apiGet(`/api/results/${resultId}`);
    if (response.ok) resultData = normalizeResult(response.data);
  }

  if (!resultData && resultId) {
    const found = MockData.results.find(r => r.resultId === parseInt(resultId, 10));
    resultData = found ? normalizeResult(found) : null;
  }

  if (!resultData) resultData = normalizeResult(MockData.results[0]);
  displayResult(resultData);
}

function displayResult(data) {
  document.getElementById('imageNameLabel').textContent = 'Image: ' + data.imageName;
  document.getElementById('countDisplay').textContent = data.tasselCount;
  document.getElementById('confidenceDisplay').textContent = formatPercent(data.confidenceScore);
  document.getElementById('timeDisplay').textContent = Number(data.processingTime || 0).toFixed(1) + 's';

  var imageId = data.imageId;
  var dbUrl = imageId ? API_BASE + '/api/images/' + imageId + '/file/original' : null;
  var fileUrl = resolveAssetUrl(data.originalImagePath || data.imagePath);
  var imgUrl = dbUrl || fileUrl;
  var fallbackMsg = 'Maize Field Image - ' + data.tasselCount + ' Tassels Detected';

  // Reset state
  var annImg = document.getElementById('annotatedImg');
  var oriImg = document.getElementById('originalImg');
  var overlay = document.getElementById('annotationOverlay');
  annImg.style.display = 'block';
  oriImg.style.display = 'block';
  overlay.innerHTML = '';

  if (imgUrl) {
    // Show fallback in overlay while image loads
    overlay.innerHTML =
      '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
      '<text x="50%" y="50%" text-anchor="middle" fill="#888" font-size="14" font-family="sans-serif">Loading image...</text>';

    annImg.onload = function() {
      overlay.innerHTML = '';
      if (data.bboxData) renderAnnotationOverlay(data, true);
      console.log('Image loaded: ' + imgUrl.substring(0,80));
    };
    annImg.onerror = function() {
      annImg.onerror = null;
      annImg.style.display = 'none';
      overlay.innerHTML =
        '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
        '<text x="50%" y="45%" text-anchor="middle" fill="#558b2f" font-size="18" font-family="sans-serif">' + esc(fallbackMsg) + '</text>' +
        '<text x="50%" y="58%" text-anchor="middle" fill="#888" font-size="13" font-family="sans-serif">[ Image data not available in database ]</text>';
      console.warn('Image failed: ' + imgUrl.substring(0,80));
    };
    annImg.src = imgUrl;
    oriImg.src = imgUrl;
  } else {
    // No image URL at all
    annImg.style.display = 'none';
    oriImg.style.display = 'none';
    overlay.innerHTML =
      '<rect width="100%" height="100%" fill="#f0f4c3"/>' +
      '<text x="50%" y="45%" text-anchor="middle" fill="#558b2f" font-size="18" font-family="sans-serif">' + esc(fallbackMsg) + '</text>' +
      '<text x="50%" y="58%" text-anchor="middle" fill="#888" font-size="13" font-family="sans-serif">[ Result data unavailable ]</text>';
  }

  // Always show both images (compare mode shows side-by-side)
  document.getElementById('originalPanel').style.display = 'none';
  document.getElementById('imageContainer').style.gridTemplateColumns = '1fr';
  document.getElementById('compareToggle').checked = false;
}

function renderAnnotationOverlay(data, hasRealImage) {
  const overlay = document.getElementById('annotationOverlay');
  const bbox = data.bboxData;
  if (!hasRealImage || !bbox) {
    overlay.innerHTML = '';
    return;
  }

  const width = bbox.image_width || bbox.imageWidth || 600;
  const height = bbox.image_height || bbox.imageHeight || 400;
  overlay.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const boxes = Array.isArray(bbox.boxes) ? bbox.boxes : [];
  const points = Array.isArray(bbox.points) ? bbox.points : [];
  const boxMarkup = boxes.slice(0, 250).map(box => {
    const x = box.x ?? box.xmin ?? 0;
    const y = box.y ?? box.ymin ?? 0;
    const w = box.width ?? ((box.xmax ?? x) - x) ?? 20;
    const h = box.height ?? ((box.ymax ?? y) - y) ?? 20;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#e76f51" stroke-width="4" rx="4"/>`;
  }).join('');
  const pointMarkup = points.slice(0, 300).map(point => {
    const x = point.x ?? point.cx ?? 0;
    const y = point.y ?? point.cy ?? 0;
    return `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#e76f51" stroke-width="4"/>`;
  }).join('');

  overlay.innerHTML = boxMarkup + pointMarkup;
}

function toggleCompare() {
  const checked = document.getElementById('compareToggle').checked;
  document.getElementById('imageContainer').style.gridTemplateColumns = checked ? '1fr 1fr' : '1fr';
  document.getElementById('originalPanel').style.display = checked ? 'block' : 'none';
}

function saveResult() {
  alert('Result saved to history!');
  location.href = 'history.html';
}

loadResult();
</script>
</body>
</html>
