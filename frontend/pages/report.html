<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maize Detector — System Report</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="dashboard.html">Maize Detector</a>
  <div class="nav-links">
    <a href="dashboard.html">Home</a>
    <a href="upload.html">Upload</a>
    <a href="history.html">History</a>
    <a href="report.html">Report</a>
    <a href="export.html">Export</a>
    <a href="agronomist.html">Agronomist</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="container">
  <h2 class="page-title">System Report</h2>
  <p class="page-subtitle">Daily / Weekly / Monthly operation summary</p>

  <!-- Tabs (B.5 BCE: ReportPage navigation) -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('daily')">Daily</button>
    <button class="tab" onclick="switchTab('weekly')">Weekly</button>
    <button class="tab" onclick="switchTab('monthly')">Monthly</button>
  </div>

  <div id="reportContent"></div>

  <!-- Export PDF (B.5 BCE: exportPDF) -->
  <div style="margin-top:1rem;">
    <button class="btn btn-primary" onclick="exportPDF()">Export Report as PDF</button>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
setActiveNav();

// Fallback mock data in case API is unavailable
const fallbackData = {
  daily: { report_type: 'daily', report_date: '2026-06-13', total_uploads: 24, successful_detections: 22, failed_detections: 2, average_tassel_count: 31 },
  weekly: { report_type: 'weekly', report_date: '2026-06-13', total_uploads: 148, successful_detections: 139, failed_detections: 9, average_tassel_count: 33 },
  monthly: { report_type: 'monthly', report_date: '2026-06-01', total_uploads: 520, successful_detections: 496, failed_detections: 24, average_tassel_count: 34 },
};

const reportCache = {};

async function renderReport(type) {
  const el = document.getElementById('reportContent');
  el.innerHTML = '<div class="card" style="text-align:center;padding:3rem;"><span class="spinner"></span> Loading report...</div>';

  let d;
  if (reportCache[type]) {
    d = reportCache[type];
  } else {
    const res = await apiGet(`/api/reports/${type}`);
    if (res.ok && res.data.report) {
      d = res.data.report;
      reportCache[type] = d;
    } else {
      d = fallbackData[type];
    }
  }

  const success = d.successful_detections || 0;
  const fail = d.failed_detections || 0;
  const total = success + fail || 1;
  const successPct = Math.round((success / total) * 100);
  const failPct = 100 - successPct;

  el.innerHTML = `<div class="card"><h3 style="color:var(--green);margin-bottom:0.75rem;">${type.charAt(0).toUpperCase() + type.slice(1)} Report &mdash; ${d.report_date || ''}</h3>
    <div class="card-grid">
      <div class="stat-card"><div class="value">${d.total_uploads || 0}</div><div class="label">Total Uploads</div></div>
      <div class="stat-card"><div class="value">${success}</div><div class="label">Successful Detections</div></div>
      <div class="stat-card"><div class="value" style="color:var(--red);">${fail}</div><div class="label">Failed Detections</div></div>
      <div class="stat-card"><div class="value">${Number(d.average_tassel_count || 0).toFixed(1)}</div><div class="label">Avg Tassel Count</div></div>
    </div>
    <div style="margin-top:1.5rem;"><h4 style="margin-bottom:0.5rem;">Success Rate (Bar Chart)</h4>
      <div style="background:var(--gray-100);border-radius:6px;height:40px;overflow:hidden;display:flex;">
        <div style="background:var(--green);height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;font-weight:600;width:${successPct}%;">Success (${successPct}%)</div>
        ${fail > 0 ? `<div style="background:var(--red);height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;font-weight:600;width:${failPct}%;">Fail (${failPct}%)</div>` : ''}
      </div>
    </div>
    <div style="margin-top:1.5rem;"><h4 style="margin-bottom:0.5rem;">Detection Trend</h4>
      <div style="background:var(--white);border:1px solid var(--gray-100);border-radius:6px;padding:1.5rem;text-align:center;">
        <svg width="100%" height="150" viewBox="0 0 400 150"><polyline fill="none" stroke="var(--green)" stroke-width="3" points="20,120 80,100 140,110 200,85 260,95 320,60 380,40"/><circle cx="380" cy="40" r="4" fill="var(--green)"/></svg>
        <p class="info-text">Detection count trending upward over the period</p>
      </div>
    </div>
  </div>`;
}

function switchTab(type) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderReport(type);
}

function exportPDF() {
  window.print();
}

renderReport('daily');
</script>
</body>
</html>
