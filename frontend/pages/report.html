<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maize Detector - Visual Report</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="nav" id="mainNav"></nav>
<div class="container">
  <!-- USER STORY B.6 Boundary: choose date range, fields, and report type. -->
  <h2 class="page-title">Generate Visual Report</h2>
  <p class="page-subtitle">Select fields and a date range, then save a report with chart data</p>

  <div class="card" id="reportControls">
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
      <div class="form-group"><label>From</label><input id="reportFrom" type="date"></div>
      <div class="form-group"><label>To</label><input id="reportTo" type="date"></div>
      <div class="form-group"><label>Report Type</label>
        <select id="reportType"><option>daily</option><option selected>weekly</option><option>monthly</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>Fields</label>
      <div id="fieldChoices" style="display:flex;gap:1rem;flex-wrap:wrap;"></div>
    </div>
    <button class="btn btn-primary" id="generateReport">Generate Report</button>
    <span id="reportMessage" class="info-text" style="margin-left:0.75rem;"></span>
  </div>

  <div id="reportContent"></div>
  <button class="btn btn-outline" id="exportPdf" style="display:none;" onclick="window.print()">Export PDF</button>
</div>

<script src="../js/api.js?v=20260610-2"></script>
<script src="../js/auth.js?v=20260610-2"></script>
<script>
if (!requireRole(["Researcher"])) throw new Error('Access denied');
initNav();

function defaultDates() {
  const to = new Date();
  const from = new Date(to);
  from.setDate(to.getDate() - 30);
  document.getElementById('reportTo').value = to.toISOString().slice(0, 10);
  document.getElementById('reportFrom').value = from.toISOString().slice(0, 10);
}

async function loadFields() {
  const response = await apiGet('/api/fields');
  const fields = response.ok ? response.data.fields : [];
  document.getElementById('fieldChoices').innerHTML = fields.map(field =>
    '<label class="toggle"><input class="report-field" type="checkbox" value="' +
    field.field_id + '" checked> ' + esc(field.field_name) + '</label>'
  ).join('') || '<span class="info-text">No fields configured; all detections will be included.</span>';
}

// USER STORY B.6 Boundary rendering: show persisted summary and chart data.
function renderGeneratedReport(data) {
  const report = data.report;
  const chart = data.chart_data;
  const max = Math.max(...chart.values, 1);
  document.getElementById('reportContent').innerHTML =
    '<div class="card"><h3 style="color:var(--green);">Saved Report #' + report.report_id + '</h3>' +
    '<div class="card-grid"><div class="stat-card"><div class="value">' + report.total_uploads +
    '</div><div class="label">Records</div></div><div class="stat-card"><div class="value">' +
    Number(report.average_tassel_count || 0).toFixed(1) +
    '</div><div class="label">Average Tassel Count</div></div></div>' +
    '<h4>Detection Bar Chart</h4><div style="display:flex;align-items:end;gap:0.4rem;height:220px;padding:1rem;background:var(--gray-50);">' +
    chart.values.map((value, index) =>
      '<div style="flex:1;text-align:center;"><div style="height:' + Math.max(4, value / max * 160) +
      'px;background:var(--green);"></div><small>' + esc(chart.labels[index]) + '<br>' + value + '</small></div>'
    ).join('') + '</div><h4 style="margin-top:1rem;">Trend Line</h4>' +
    '<p class="info-text">' + esc(chart.average_counts.join(' -> ')) + '</p>' +
    '<div class="alert alert-success">' + esc(chart.summary) + '</div></div>';
  document.getElementById('exportPdf').style.display = 'inline-flex';
}

// USER STORY B.6 Control call: aggregate records and save the report entity.
document.getElementById('generateReport').onclick = async function() {
  const button = this;
  button.disabled = true;
  document.getElementById('reportMessage').textContent = 'Querying and aggregating detection records...';
  const fieldIds = Array.from(document.querySelectorAll('.report-field:checked')).map(item => Number(item.value));
  const response = await apiPost('/api/reports', {
    date_from: document.getElementById('reportFrom').value,
    date_to: document.getElementById('reportTo').value,
    field_ids: fieldIds,
    report_type: document.getElementById('reportType').value
  });
  button.disabled = false;
  if (!response.ok) {
    document.getElementById('reportMessage').textContent = response.error || 'Report generation failed.';
    return;
  }
  document.getElementById('reportMessage').textContent = 'Report saved.';
  renderGeneratedReport(response.data);
};

defaultDates();
loadFields();
</script>
</body>
</html>
